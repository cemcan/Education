# GRE vocabulary, part 8. Examples are added by build_words.py; never write them here.
words:
- word: squalid
  pos: adjective
  ipa: /ˈskwɑlɪd/
  phonetic: SKWOL-id
  definition: Extremely dirty and unpleasant, especially from neglect or poverty; morally degraded or sordid.
  synonyms: [filthy, sordid, wretched, seedy, foul]
  antonyms: [clean, pristine, immaculate]
  related: [squalor, squalidly, squalidness]
  etymology: From Latin squalidus "rough, dirty," from squalere "to be stiff with dirt."
  forms: [squalidly, squalidness]

- word: staid
  pos: adjective
  ipa: /steɪd/
  phonetic: STAYD
  definition: Sedate, respectable, and unadventurous; dull and conventional.
  synonyms: [sedate, sober, prim, conventional, stuffy]
  antonyms: [flamboyant, adventurous, frivolous]
  related: [staidly, staidness]
  etymology: An old past participle of "stay," in the sense "fixed, settled."
  forms: [staidly, staidness]

- word: stalwart
  pos: adjective / noun
  ipa: /ˈstɔlwərt/
  phonetic: STAWL-wurt
  definition: Loyal, reliable, and hardworking; strongly built; a loyal, steadfast supporter of a cause or organization.
  synonyms: [steadfast, staunch, loyal, sturdy, dependable]
  antonyms: [disloyal, unreliable, faithless]
  related: [stalwartly, stalwartness]
  etymology: From Old English stælwierthe "serviceable," a Scots variant of "stalworth."
  forms: [stalwarts, stalwartly, stalwartness]

- word: stilted
  pos: adjective
  ipa: /ˈstɪltɪd/
  phonetic: STIL-tid
  definition: Stiff, artificial, and unnatural in manner or language; overly formal.
  synonyms: [stiff, wooden, forced, unnatural, affected]
  antonyms: [natural, fluent, relaxed]
  related: [stiltedly, stiltedness]
  etymology: From "stilt," originally meaning raised on stilts, hence pompous or elevated.
  forms: [stiltedly, stiltedness]

- word: stingy
  pos: adjective
  ipa: /ˈstɪndʒi/
  phonetic: STIN-jee
  definition: Unwilling to give or spend money; mean and ungenerous; scanty or meager.
  synonyms: [miserly, parsimonious, tight-fisted, niggardly, penurious]
  antonyms: [generous, lavish, munificent]
  related: [stinginess, stingily]
  forms: [stingier, stingiest, stingily, stinginess]

- word: stipulate
  pos: verb
  ipa: /ˈstɪpjəleɪt/
  phonetic: STIP-yuh-layt
  definition: To demand or specify as a requirement, especially as part of an agreement or contract.
  synonyms: [specify, require, set down, prescribe, insist on]
  antonyms: [waive, forgo]
  related: [stipulation]
  etymology: From Latin stipulari "to demand a formal promise," a term of Roman contract law.
  forms: [stipulated, stipulates, stipulating, stipulation, stipulations]

- word: stolid
  pos: adjective
  ipa: /ˈstɑlɪd/
  phonetic: STOL-id
  definition: Calm, dependable, and showing little emotion or animation; impassive.
  synonyms: [impassive, phlegmatic, unemotional, stoical, bovine]
  antonyms: [excitable, emotional, animated]
  related: [stolidly, stolidity]
  etymology: From Latin stolidus "dull, stupid, slow."
  forms: [stolidly, stolidity, stolidness]

- word: strident
  pos: adjective
  ipa: /ˈstraɪdənt/
  phonetic: STRY-dunt
  definition: Loud and harsh, grating; presenting a point of view forcefully and aggressively.
  synonyms: [harsh, shrill, grating, vociferous, insistent]
  antonyms: [soft, mellow, muted]
  related: [stridency, stridently]
  etymology: From Latin stridere "to creak, make a harsh noise."
  forms: [stridently, stridency]
  exclude: ["(In strident discord peasants"]

- word: stupefy
  pos: verb
  ipa: /ˈstupəfaɪ/
  phonetic: STOO-puh-fy
  definition: To make someone unable to think or feel properly; to astonish or shock greatly.
  synonyms: [daze, stun, numb, astound, dumbfound]
  antonyms: [enliven, stimulate]
  related: [stupefaction, stupefying]
  etymology: From Latin stupefacere, from stupere "to be stunned" + facere "to make."
  forms: [stupefied, stupefies, stupefying, stupefaction]

- word: stupor
  pos: noun
  ipa: /ˈstupər/
  phonetic: STOO-pur
  definition: A state of near-unconsciousness or greatly dulled senses.
  synonyms: [daze, torpor, lethargy, trance, insensibility]
  antonyms: [alertness, awareness]
  related: [stuporous]
  etymology: From Latin stupor "numbness, astonishment," from stupere "to be stunned."
  forms: [stupors]

- word: suave
  pos: adjective
  ipa: /swɑv/
  phonetic: SWAHV
  definition: Charming, confident, and elegant, typically of a man; smoothly polite, sometimes superficially so.
  synonyms: [urbane, debonair, smooth, polished, sophisticated]
  antonyms: [boorish, gauche, uncouth]
  related: [suavely, suavity]
  etymology: From French suave, from Latin suavis "agreeable, sweet."
  forms: [suavely, suavity, suaveness]

- word: subjugate
  pos: verb
  ipa: /ˈsʌbdʒəɡeɪt/
  phonetic: SUB-juh-gayt
  definition: To bring under domination or control, especially by conquest.
  synonyms: [conquer, subdue, vanquish, oppress, enslave]
  antonyms: [liberate, free, emancipate]
  related: [subjugation]
  etymology: From Latin subjugare "to bring under the yoke," from sub- "under" + jugum "yoke."
  forms: [subjugated, subjugates, subjugating, subjugation]

- word: sublime
  pos: adjective
  ipa: /səˈblaɪm/
  phonetic: suh-BLYME
  definition: Of such excellence, grandeur, or beauty as to inspire great admiration or awe.
  synonyms: [exalted, magnificent, glorious, transcendent, majestic]
  antonyms: [ridiculous, base, mundane]
  related: [sublimity, sublimely]
  etymology: From Latin sublimis "uplifted, lofty."
  forms: [sublimely, sublimity]

- word: subservient
  pos: adjective
  ipa: /səbˈsɜrviənt/
  phonetic: sub-SUR-vee-unt
  definition: Excessively willing to obey others; less important, subordinate.
  synonyms: [servile, obsequious, submissive, deferential, subordinate]
  antonyms: [domineering, assertive, independent]
  related: [subservience, subserviently]
  etymology: From Latin subservire "to be subject to, comply with," from sub- "under" + servire "to serve."
  forms: [subservience, subserviently]

- word: subside
  pos: verb
  ipa: /səbˈsaɪd/
  phonetic: sub-SYDE
  definition: To become less intense, violent, or severe; to sink to a lower level.
  synonyms: [abate, wane, ebb, diminish, recede]
  antonyms: [intensify, escalate, rise]
  related: [subsidence]
  etymology: From Latin subsidere "to settle, sink," from sub- "down" + sidere "to settle."
  forms: [subsided, subsides, subsiding]

- word: substantiate
  pos: verb
  ipa: /səbˈstænʃieɪt/
  phonetic: sub-STAN-shee-ayt
  definition: To provide evidence to support or prove the truth of a claim.
  synonyms: [corroborate, verify, confirm, validate, bear out]
  antonyms: [refute, disprove, invalidate]
  related: [substantiation, unsubstantiated]
  etymology: From Latin substantia "substance, being."
  forms: [substantiated, substantiates, substantiating, substantiation]

- word: subterfuge
  pos: noun
  ipa: /ˈsʌbtərfjudʒ/
  phonetic: SUB-tur-fyooj
  definition: Deceit used in order to achieve one's goal; a trick or deceptive stratagem.
  synonyms: [deception, ruse, ploy, trickery, artifice]
  antonyms: [candor, honesty, openness]
  related: []
  etymology: From Late Latin subterfugium, from Latin subterfugere "to escape secretly," from subter- "beneath" + fugere "to flee."
  forms: [subterfuges]

- word: subversive
  pos: adjective / noun
  ipa: /səbˈvɜrsɪv/
  phonetic: sub-VUR-siv
  definition: Seeking or intended to undermine an established system or institution; a person who does so.
  synonyms: [seditious, insurrectionary, disruptive, rebellious, dissident]
  antonyms: [loyal, conformist, orthodox]
  related: [subversion, subvert, subversively]
  etymology: From Latin subvertere "to overturn," from sub- "from below" + vertere "to turn."
  forms: [subversives, subversively, subversiveness]
  exclude: ["knows it to be,(1))"]

- word: succor
  pos: noun / verb
  ipa: /ˈsʌkər/
  phonetic: SUK-ur
  definition: Assistance and support in times of hardship and distress; to give such help.
  synonyms: [aid, relief, comfort, assistance, support]
  antonyms: [hindrance, obstruction]
  related: [succour]
  etymology: From Old French socours, from Latin succurrere "to run to the help of," from sub- "up to" + currere "to run."
  forms: [succored, succoring, succors, succour]

- word: suffuse
  pos: verb
  ipa: /səˈfjuz/
  phonetic: suh-FYOOZ
  definition: To gradually spread through or over, as with a color, light, liquid, or feeling.
  synonyms: [permeate, pervade, imbue, saturate, infuse]
  antonyms: []
  related: [suffusion]
  etymology: From Latin suffundere "to pour beneath," from sub- "under" + fundere "to pour."
  forms: [suffused, suffuses, suffusing, suffusion]

- word: sumptuous
  pos: adjective
  ipa: /ˈsʌmptʃuəs/
  phonetic: SUMP-choo-us
  definition: Splendid and expensive-looking; lavish.
  synonyms: [lavish, opulent, luxurious, extravagant, magnificent]
  antonyms: [plain, austere, meager]
  related: [sumptuously, sumptuousness]
  etymology: From Latin sumptuosus, from sumptus "expense," from sumere "to take, spend."
  forms: [sumptuously, sumptuousness]

- word: supercilious
  pos: adjective
  ipa: /ˌsupərˈsɪliəs/
  phonetic: soo-pur-SIL-ee-us
  definition: Behaving or looking as though one thinks one is superior to others; haughtily disdainful.
  synonyms: [haughty, arrogant, disdainful, condescending, contemptuous]
  antonyms: [humble, modest, deferential]
  related: [superciliously, superciliousness]
  etymology: From Latin supercilium "eyebrow," evoking a raised, scornful brow.
  forms: [superciliously, superciliousness]

- word: superfluous
  pos: adjective
  ipa: /suˈpɜrfluəs/
  phonetic: soo-PUR-floo-us
  definition: Unnecessary, especially through being more than enough.
  synonyms: [redundant, excess, surplus, unnecessary, extraneous]
  antonyms: [essential, necessary, requisite]
  related: [superfluity, superfluously]
  etymology: From Latin superfluus "overflowing," from super- "over" + fluere "to flow."
  forms: [superfluously, superfluity]

- word: supine
  pos: adjective
  ipa: /ˈsupaɪn/
  phonetic: SOO-pyne
  definition: Lying face upward; failing to act or protest out of moral weakness or indolence.
  synonyms: [recumbent, prostrate, passive, inert, spineless]
  antonyms: [prone, active, assertive]
  related: [supinely]
  etymology: From Latin supinus "bent backward, lying on the back."
  forms: [supinely]

- word: supplant
  pos: verb
  ipa: /səˈplænt/
  phonetic: suh-PLANT
  definition: To supersede and replace, often by force or scheming.
  synonyms: [replace, supersede, displace, oust, usurp]
  antonyms: []
  related: [supplanter]
  etymology: From Latin supplantare "to trip up," from sub- "under" + planta "sole of the foot."
  forms: [supplanted, supplants, supplanting]

- word: supple
  pos: adjective
  ipa: /ˈsʌpəl/
  phonetic: SUP-ul
  definition: Bending and moving easily and gracefully; flexible; adaptable in mind or behavior.
  synonyms: [flexible, pliant, lithe, limber, agile]
  antonyms: [rigid, stiff, inflexible]
  related: [suppleness]
  etymology: From Old French souple, from Latin supplex "submissive, bending under."
  forms: [suppler, supplest, suppleness]

- word: supplicate
  pos: verb
  ipa: /ˈsʌplɪkeɪt/
  phonetic: SUP-li-kayt
  definition: To ask or beg for something earnestly or humbly.
  synonyms: [beseech, implore, entreat, plead, petition]
  antonyms: [demand, command]
  related: [supplication, supplicant, suppliant]
  etymology: From Latin supplicare "to kneel down, beg humbly," from supplex "kneeling in entreaty."
  forms: [supplicated, supplicates, supplicating, supplication]

- word: surfeit
  pos: noun / verb
  ipa: /ˈsɜrfɪt/
  phonetic: SUR-fit
  definition: An excessive amount of something; to cause someone to overindulge or be sated.
  synonyms: [excess, glut, surplus, overabundance, plethora]
  antonyms: [dearth, scarcity, shortage]
  related: [surfeited]
  etymology: From Old French surfait "excess," from sur- "over" + faire "to do."
  forms: [surfeits, surfeited]

- word: surly
  pos: adjective
  ipa: /ˈsɜrli/
  phonetic: SUR-lee
  definition: Bad-tempered and unfriendly; rude and gruff.
  synonyms: [sullen, gruff, churlish, crabby, sour]
  antonyms: [friendly, amiable, genial]
  related: [surliness]
  etymology: An alteration of obsolete "sirly," meaning "lordly, haughty," from "sir."
  forms: [surlier, surliest, surliness]

- word: surmise
  pos: verb / noun
  ipa: /sərˈmaɪz/
  phonetic: sur-MYZE
  definition: To suppose something is true without conclusive evidence; a guess or supposition.
  synonyms: [guess, conjecture, infer, speculate, suspect]
  antonyms: [know, prove]
  related: []
  etymology: From Old French surmise "accusation," from surmettre "to accuse," from Latin super- "upon" + mittere "to send."
  forms: [surmised, surmises, surmising]

- word: surmount
  pos: verb
  ipa: /sərˈmaʊnt/
  phonetic: sur-MOWNT
  definition: To overcome a difficulty or obstacle; to stand or be placed on top of.
  synonyms: [overcome, conquer, prevail over, vanquish, master]
  antonyms: [succumb, yield]
  related: [insurmountable, surmountable]
  etymology: From Old French surmonter, from sur- "over" + monter "to climb."
  forms: [surmounted, surmounts, surmounting]

- word: surreptitious
  pos: adjective
  ipa: /ˌsɜrəpˈtɪʃəs/
  phonetic: sur-up-TISH-us
  definition: Kept secret, especially because it would not be approved of; done stealthily.
  synonyms: [secret, stealthy, furtive, clandestine, covert]
  antonyms: [open, overt, aboveboard]
  related: [surreptitiously]
  etymology: From Latin surrepticius "stolen, secret," from surripere "to seize secretly," from sub- "under" + rapere "to seize."
  forms: [surreptitiously, surreptitiousness]

- word: surrogate
  pos: noun / adjective
  ipa: /ˈsɜrəɡət/
  phonetic: SUR-uh-gut
  definition: A substitute, especially a person deputizing for another in a role or office.
  synonyms: [substitute, proxy, stand-in, deputy, replacement]
  antonyms: [original]
  related: [surrogacy]
  etymology: From Latin surrogare "to elect as a substitute," from sub- "in place of" + rogare "to ask."
  forms: [surrogates]

- word: tacit
  pos: adjective
  ipa: /ˈtæsɪt/
  phonetic: TAS-it
  definition: Understood or implied without being stated.
  synonyms: [implicit, unspoken, implied, understood, wordless]
  antonyms: [explicit, express, stated]
  related: [tacitly, taciturn]
  etymology: From Latin tacitus "silent," from tacere "to be silent."
  forms: [tacitly]

- word: tantamount
  pos: adjective
  ipa: /ˈtæntəmaʊnt/
  phonetic: TAN-tuh-mownt
  definition: Equivalent in seriousness or effect to; virtually the same as.
  synonyms: [equivalent, equal, comparable, synonymous, as good as]
  antonyms: [unlike, dissimilar]
  related: []
  etymology: From Anglo-French tant amunter "to amount to as much," from Latin tantus "so great."

- word: tawdry
  pos: adjective
  ipa: /ˈtɔdri/
  phonetic: TAW-dree
  definition: Showy but cheap and of poor quality; sordid or unpleasant.
  synonyms: [gaudy, garish, tacky, cheap, sleazy]
  antonyms: [tasteful, elegant, refined]
  related: [tawdriness]
  etymology: A shortening of "tawdry lace," from "St. Audrey's lace," cheap neckwear sold at fairs honoring St. Audrey (Æthelthryth) of Ely.
  forms: [tawdriness]

- word: tedium
  pos: noun
  ipa: /ˈtidiəm/
  phonetic: TEE-dee-um
  definition: The state of being tedious; tiresome monotony.
  synonyms: [monotony, boredom, dullness, ennui, tediousness]
  antonyms: [excitement, interest, variety]
  related: [tedious, tediously]
  etymology: From Latin taedium "weariness, disgust," from taedere "to weary."
  forms: [tediousness]

- word: temperance
  pos: noun
  ipa: /ˈtɛmpərəns/
  phonetic: TEM-pur-uns
  definition: Moderation or self-restraint, especially in eating or drinking; abstinence from alcohol.
  synonyms: [moderation, self-restraint, abstinence, sobriety, self-control]
  antonyms: [intemperance, excess, indulgence]
  related: [temperate, intemperance]
  etymology: From Latin temperantia "moderation," from temperare "to restrain, mix in due proportion."
  exclude: ["Dull business by day, land agents"]

- word: temperate
  pos: adjective
  ipa: /ˈtɛmpərət/
  phonetic: TEM-pur-ut
  definition: Showing moderation or self-restraint; mild in climate, without extremes of temperature.
  synonyms: [moderate, restrained, measured, mild, self-controlled]
  antonyms: [intemperate, immoderate, extreme]
  related: [temperance, temperately]
  etymology: From Latin temperatus "restrained, moderate," past participle of temperare.
  forms: [temperately]

- word: tenacity
  pos: noun
  ipa: /təˈnæsɪti/
  phonetic: tuh-NAS-ih-tee
  definition: The quality of being very determined or persistent; firmness of grip or adherence.
  synonyms: [persistence, determination, perseverance, doggedness, resolve]
  antonyms: [irresolution, weakness, vacillation]
  related: [tenacious, tenaciously]
  etymology: From Latin tenacitas, from tenax "holding fast," from tenere "to hold."

- word: tenet
  pos: noun
  ipa: /ˈtɛnɪt/
  phonetic: TEN-it
  definition: A principle or belief, especially one of the main principles of a religion or philosophy.
  synonyms: [principle, doctrine, belief, dogma, precept]
  antonyms: []
  related: []
  etymology: From Latin tenet "he holds," from tenere "to hold."
  forms: [tenets]

- word: tepid
  pos: adjective
  ipa: /ˈtɛpɪd/
  phonetic: TEP-id
  definition: Showing little enthusiasm; lukewarm in temperature.
  synonyms: [lukewarm, unenthusiastic, halfhearted, apathetic, indifferent]
  antonyms: [enthusiastic, ardent, fervent]
  related: [tepidly, tepidity]
  etymology: From Latin tepidus, from tepere "to be warm."
  forms: [tepidly, tepidity]

- word: timorous
  pos: adjective
  ipa: /ˈtɪmərəs/
  phonetic: TIM-ur-us
  definition: Showing or suffering from nervousness or a lack of confidence; fearful.
  synonyms: [timid, fearful, apprehensive, diffident, faint-hearted]
  antonyms: [bold, audacious, intrepid]
  related: [timorously, timorousness]
  etymology: From Medieval Latin timorosus, from Latin timor "fear."
  forms: [timorously, timorousness]

- word: tirade
  pos: noun
  ipa: /ˈtaɪreɪd/
  phonetic: TY-rayd
  definition: A long, angry speech of criticism or accusation.
  synonyms: [diatribe, harangue, rant, broadside, invective]
  antonyms: [encomium, eulogy, panegyric]
  related: []
  etymology: From French tirade "long speech," from Italian tirata "a volley," from tirare "to pull."
  forms: [tirades]

- word: toady
  pos: noun / verb
  ipa: /ˈtoʊdi/
  phonetic: TOH-dee
  definition: A person who flatters or defers to others for self-interest; to act obsequiously toward someone.
  synonyms: [sycophant, flatterer, lackey, bootlicker, yes-man]
  antonyms: []
  related: [toadyism]
  etymology: Short for "toadeater," a charlatan's assistant who pretended to eat poisonous toads so the master could "cure" him.
  forms: [toadies, toadied, toadying]

- word: tome
  pos: noun
  ipa: /toʊm/
  phonetic: TOHM
  definition: A book, especially a large, heavy, scholarly one.
  synonyms: [volume, book, opus, work, treatise]
  antonyms: []
  related: []
  etymology: From Greek tomos "section, volume," from temnein "to cut."
  forms: [tomes]

- word: torrid
  pos: adjective
  ipa: /ˈtɔrɪd/
  phonetic: TOR-id
  definition: Very hot and dry; full of intense emotion, especially passion; full of difficulty.
  synonyms: [scorching, sweltering, parched, passionate, ardent]
  antonyms: [cold, frigid, cool]
  related: [torridly]
  etymology: From Latin torridus, from torrere "to parch, scorch."
  forms: [torridly]
  exclude: ["heart of the Torrid Zone"]
  lowercase_only: true

- word: tortuous
  pos: adjective
  ipa: /ˈtɔrtʃuəs/
  phonetic: TOR-choo-us
  definition: Full of twists and turns; excessively lengthy and complex.
  synonyms: [winding, twisting, convoluted, labyrinthine, circuitous]
  antonyms: [straight, direct, simple]
  related: [tortuously, tortuousness, tortuosity]
  etymology: From Latin tortuosus, from tortus "twisted," past participle of torquere "to twist."
  forms: [tortuously, tortuousness]

- word: tractable
  pos: adjective
  ipa: /ˈtræktəbəl/
  phonetic: TRAK-tuh-bul
  definition: Easy to control or influence; easily managed or dealt with.
  synonyms: [manageable, docile, compliant, amenable, malleable]
  antonyms: [intractable, unruly, obstinate]
  related: [tractability, intractable]
  etymology: From Latin tractabilis, from tractare "to handle," frequentative of trahere "to draw."
  forms: [tractability]

- word: transgression
  pos: noun
  ipa: /trænzˈɡrɛʃən/
  phonetic: tranz-GRESH-un
  definition: An act that goes against a law, rule, or code of conduct; an offense.
  synonyms: [offense, violation, infraction, misdeed, sin]
  antonyms: [obedience, compliance]
  related: [transgress, transgressor, transgressive]
  etymology: From Latin transgressio, from transgredi "to step across," from trans- "across" + gradi "to step."
  forms: [transgressions]

- word: transient
  pos: adjective / noun
  ipa: /ˈtrænʃənt/
  phonetic: TRAN-shunt
  definition: Lasting only for a short time; impermanent; a person staying in a place only briefly.
  synonyms: [fleeting, ephemeral, transitory, momentary, evanescent]
  antonyms: [permanent, enduring, lasting]
  related: [transience, transiently]
  etymology: From Latin transire "to go across," from trans- "across" + ire "to go."
  forms: [transience, transiently, transients]
  exclude: ["There are passions, transient, fleeting"]

- word: transitory
  pos: adjective
  ipa: /ˈtrænsɪˌtɔri/
  phonetic: TRAN-sih-tor-ee
  definition: Not permanent; lasting only a brief time.
  synonyms: [fleeting, ephemeral, transient, momentary, short-lived]
