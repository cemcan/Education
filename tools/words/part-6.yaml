# GRE vocabulary, part 6. Examples are added by build_words.py; never write them here.
words:
- word: luxuriant
  pos: adjective
  ipa: /lʌɡˈʒʊriənt/
  phonetic: luhg-ZHOOR-ee-unt
  definition: Growing thickly and abundantly; lush; richly ornate or profuse.
  synonyms: [lush, abundant, profuse, rank, exuberant]
  antonyms: [sparse, barren, meager]
  related: [luxuriance, luxuriantly]
  etymology: From Latin luxuriare "to grow rank, be excessive," from luxuria "excess."
  forms: [luxuriantly, luxuriance]

- word: machination
  pos: noun
  ipa: /ˌmækəˈneɪʃən/
  phonetic: mak-uh-NAY-shun
  definition: A crafty scheme or plot intended to achieve a sinister end.
  synonyms: [scheme, plot, intrigue, conspiracy, ploy]
  antonyms: []
  related: [machinate]
  etymology: From Latin machinatio, from machinari "to contrive, plot," from machina "device."
  forms: [machinations]

- word: malady
  pos: noun
  ipa: /ˈmælədi/
  phonetic: MAL-uh-dee
  definition: A disease or ailment; a serious problem afflicting a society or institution.
  synonyms: [illness, ailment, affliction, disorder, sickness]
  antonyms: [health, wellness]
  related: []
  etymology: From Old French maladie, from malade "sick," from Latin male habitus "in poor condition."
  forms: [maladies]

- word: malevolent
  pos: adjective
  ipa: /məˈlɛvələnt/
  phonetic: muh-LEV-uh-lunt
  definition: Having or showing a wish to do evil or harm to others.
  synonyms: [malicious, malign, spiteful, hostile, wicked]
  antonyms: [benevolent, kind, benign]
  related: [malevolence, malevolently]
  etymology: From Latin malevolens, from male "badly" + volens "wishing."
  forms: [malevolence, malevolently]

- word: malice
  pos: noun
  ipa: /ˈmælɪs/
  phonetic: MAL-iss
  definition: The intention or desire to do harm or evil; ill will.
  synonyms: [ill will, spite, malevolence, rancor, animosity]
  antonyms: [goodwill, benevolence, kindness]
  related: [malicious, maliciously]
  etymology: From Old French malice, from Latin malitia "badness," from malus "bad."
  forms: [malicious, maliciously]

- word: malign
  pos: verb / adjective
  ipa: /məˈlaɪn/
  phonetic: muh-LYNE
  definition: To speak harmful untruths about; slander; (as adjective) evil in nature or harmful in effect.
  synonyms: [slander, defame, vilify, disparage, denigrate]
  antonyms: [praise, extol, defend]
  related: [malignity, malignant]
  etymology: From Latin malignus "evil-disposed," from malus "bad."
  forms: [maligned, maligns, maligning]

- word: manifest
  pos: adjective / verb
  ipa: /ˈmænəˌfɛst/
  phonetic: MAN-uh-fest
  definition: Clear or obvious to the eye or mind; to show or display plainly.
  synonyms: [evident, obvious, plain, patent, apparent]
  antonyms: [hidden, latent, obscure]
  related: [manifestation, manifestly]
  etymology: From Latin manifestus "palpable, evident."
  forms: [manifested, manifesting, manifestly]

- word: manifold
  pos: adjective
  ipa: /ˈmænəˌfoʊld/
  phonetic: MAN-uh-fohld
  definition: Many and various; having many different forms or elements.
  synonyms: [numerous, multiple, diverse, varied, multifarious]
  antonyms: [single, few, uniform]
  related: []
  etymology: From Old English manigfeald "many-fold."

- word: maudlin
  pos: adjective
  ipa: /ˈmɔdlɪn/
  phonetic: MAWD-lin
  definition: Self-pityingly or tearfully sentimental, often from drunkenness.
  synonyms: [mawkish, sentimental, mushy, tearful, schmaltzy]
  antonyms: [unsentimental, restrained]
  related: []
  etymology: From Middle English Maudelen, Mary Magdalene, who was commonly depicted weeping.

- word: mawkish
  pos: adjective
  ipa: /ˈmɔkɪʃ/
  phonetic: MAW-kish
  definition: Excessively or falsely sentimental; sickly or feeble in sentiment.
  synonyms: [maudlin, cloying, saccharine, sentimental, schmaltzy]
  antonyms: [unsentimental, restrained]
  related: [mawkishness, mawkishly]
  etymology: From obsolete mawk "maggot"; the word originally meant "nauseated" or "nauseating."
  forms: [mawkishly, mawkishness]

- word: maxim
  pos: noun
  ipa: /ˈmæksɪm/
  phonetic: MAK-sim
  definition: A short statement expressing a general truth or rule of conduct.
  synonyms: [aphorism, adage, axiom, precept, saying]
  antonyms: []
  related: []
  etymology: From Medieval Latin maxima, as in maxima propositio "greatest premise."
  forms: [maxims]
  lowercase_only: true

- word: meager
  pos: adjective
  ipa: /ˈmiɡər/
  phonetic: MEE-gur
  definition: Lacking in quantity or quality; deficient or scanty.
  synonyms: [scanty, paltry, sparse, inadequate, slim]
  antonyms: [abundant, ample, plentiful]
  related: [meagerly, meagerness]
  etymology: From Old French maigre "thin," from Latin macer "lean."
  forms: [meagre, meagerly, meagerness]

- word: mellifluous
  pos: adjective
  ipa: /məˈlɪfluəs/
  phonetic: muh-LIF-loo-us
  definition: Sweet or musical; pleasant to hear.
  synonyms: [dulcet, sweet-sounding, honeyed, mellow, euphonious]
  antonyms: [harsh, grating, cacophonous]
  related: [mellifluously, mellifluousness]
  etymology: From Latin mel "honey" + fluere "to flow."
  forms: [mellifluously]

- word: mendicant
  pos: noun / adjective
  ipa: /ˈmɛndɪkənt/
  phonetic: MEN-dih-kunt
  definition: A beggar; given to begging, especially as a member of a religious order living on alms.
  synonyms: [beggar, panhandler, supplicant, pauper]
  antonyms: []
  related: [mendicancy]
  etymology: From Latin mendicare "to beg," from mendicus "beggar."
  forms: [mendicants, mendicancy]

- word: mercenary
  pos: adjective / noun
  ipa: /ˈmɜrsəˌnɛri/
  phonetic: MUR-suh-nair-ee
  definition: Motivated primarily by money or gain; a soldier hired to fight for a foreign army.
  synonyms: [avaricious, grasping, venal, greedy, money-oriented]
  antonyms: [altruistic, idealistic, generous]
  related: []
  etymology: From Latin mercenarius "hireling," from merces "wages."
  forms: [mercenaries]

- word: mercurial
  pos: adjective
  ipa: /mərˈkjʊriəl/
  phonetic: mur-KYOOR-ee-ul
  definition: Subject to sudden, unpredictable changes of mood or mind.
  synonyms: [volatile, capricious, fickle, temperamental, erratic]
  antonyms: [stable, steady, constant]
  related: [mercuriality]
  etymology: From Latin mercurialis "of Mercury," the swift messenger god whose name was also given to the volatile metal.
  forms: [mercurially]

- word: meritorious
  pos: adjective
  ipa: /ˌmɛrɪˈtɔriəs/
  phonetic: mair-ih-TOR-ee-us
  definition: Deserving reward or praise.
  synonyms: [laudable, praiseworthy, commendable, worthy, admirable]
  antonyms: [unworthy, discreditable, blameworthy]
  related: [merit, meritoriously]
  etymology: From Latin meritorius, from mereri "to earn, deserve."
  forms: [meritoriously]

- word: militate
  pos: verb
  ipa: /ˈmɪlɪˌteɪt/
  phonetic: MIL-ih-tayt
  definition: To have a strong influence or effect, especially against something; to weigh heavily against.
  synonyms: [work against, count against, hinder, impede, weigh against]
  antonyms: [favor, aid]
  related: []
  etymology: From Latin militare "to serve as a soldier," from miles "soldier."
  forms: [militated, militates, militating]

- word: mire
  pos: noun / verb
  ipa: /ˈmaɪər/
  phonetic: MY-ur
  definition: A difficult situation from which it is hard to escape; swampy ground; to entangle in difficulty.
  synonyms: [quagmire, morass, bog, swamp, predicament]
  antonyms: []
  related: []
  etymology: From Old Norse mýrr "bog."
  forms: [mired, mires, miring]

- word: misconstrue
  pos: verb
  ipa: /ˌmɪskənˈstru/
  phonetic: mis-kun-STROO
  definition: To interpret wrongly; misunderstand.
  synonyms: [misinterpret, misunderstand, misread, misjudge, mistake]
  antonyms: [understand, comprehend]
  related: [misconstruction]
  etymology: From mis- "wrongly" + construe, from Latin construere "to build up, construct."
  forms: [misconstrued, misconstrues, misconstruing]

- word: miscreant
  pos: noun
  ipa: /ˈmɪskriənt/
  phonetic: MIS-kree-unt
  definition: A person who behaves badly or unlawfully; a wrongdoer or villain.
  synonyms: [wrongdoer, villain, scoundrel, malefactor, reprobate]
  antonyms: [hero, paragon]
  related: []
  etymology: From Old French mescreant "unbelieving," from mes- "wrongly" + creant "believing."
  forms: [miscreants]

- word: motley
  pos: adjective
  ipa: /ˈmɑtli/
  phonetic: MOT-lee
  definition: Incongruously varied in appearance or character; disparate.
  synonyms: [heterogeneous, assorted, varied, mixed, miscellaneous]
  antonyms: [homogeneous, uniform]
  related: []
  etymology: From Middle English motlei, originally a cloth of mixed colors, later the costume of a jester; its deeper origin is uncertain.

- word: munificent
  pos: adjective
  ipa: /mjuˈnɪfɪsənt/
  phonetic: myoo-NIF-ih-sunt
  definition: Larger or more generous than is usual or necessary; very generous in giving.
  synonyms: [generous, bountiful, lavish, liberal, magnanimous]
  antonyms: [stingy, miserly, parsimonious]
  related: [munificence, munificently]
  etymology: From Latin munificus, from munus "gift" + facere "to make."
  forms: [munificence, munificently]

- word: mutable
  pos: adjective
  ipa: /ˈmjutəbəl/
  phonetic: MYOO-tuh-bul
  definition: Liable to change; inconstant.
  synonyms: [changeable, variable, fluid, volatile, protean]
  antonyms: [immutable, fixed, constant]
  related: [mutability]
  etymology: From Latin mutabilis, from mutare "to change."
  forms: [mutability]

- word: nebulous
  pos: adjective
  ipa: /ˈnɛbjələs/
  phonetic: NEB-yuh-lus
  definition: Vague, unclear, or ill-defined; cloudy or hazy.
  synonyms: [vague, hazy, indistinct, amorphous, ill-defined]
  antonyms: [clear, distinct, precise]
  related: [nebula, nebulously]
  etymology: From Latin nebulosus "misty," from nebula "mist, cloud."
  forms: [nebulously, nebulousness]

- word: neophyte
  pos: noun
  ipa: /ˈniəˌfaɪt/
  phonetic: NEE-uh-fyte
  definition: A person who is new to a subject, skill, or belief; a beginner.
  synonyms: [novice, beginner, tyro, novitiate, greenhorn]
  antonyms: [veteran, expert, master]
  related: []
  etymology: From Greek neophytos "newly planted," from neos "new" + phyton "plant."
  forms: [neophytes]

- word: nettle
  pos: verb / noun
  ipa: /ˈnɛtəl/
  phonetic: NET-ul
  definition: To irritate or annoy; a plant with stinging hairs.
  synonyms: [irritate, annoy, vex, provoke, rile]
  antonyms: [soothe, placate, mollify]
  related: []
  etymology: From Old English netele, the name of the stinging plant.
  forms: [nettled, nettling]

- word: noisome
  pos: adjective
  ipa: /ˈnɔɪsəm/
  phonetic: NOY-sum
  definition: Having an extremely offensive smell; disagreeable or harmful.
  synonyms: [fetid, foul, malodorous, noxious, rank]
  antonyms: [fragrant, pleasant, wholesome]
  related: []
  etymology: From Middle English noy "harm," a shortening of "annoy," + -some; it is unrelated to "noise."

- word: nonchalant
  pos: adjective
  ipa: /ˌnɑnʃəˈlɑnt/
  phonetic: non-shuh-LAHNT
  definition: Feeling or appearing casually calm and relaxed; not displaying anxiety, interest, or enthusiasm.
  synonyms: [casual, unconcerned, indifferent, blasé, insouciant]
  antonyms: [anxious, concerned, agitated]
  related: [nonchalance, nonchalantly]
  etymology: From French nonchalant, from non- "not" + chaloir "to concern," from Latin calere "to be warm."
  forms: [nonchalantly, nonchalance]

- word: nondescript
  pos: adjective
  ipa: /ˌnɑndɪˈskrɪpt/
  phonetic: non-dih-SKRIPT
  definition: Lacking distinctive or interesting features or characteristics; unremarkable.
  synonyms: [ordinary, unremarkable, bland, featureless, undistinguished]
  antonyms: [distinctive, remarkable, striking]
  related: []
  etymology: From non- + Latin descriptus "described"; it first named species not yet scientifically described.

- word: noxious
  pos: adjective
  ipa: /ˈnɑkʃəs/
  phonetic: NOK-shus
  definition: Harmful, poisonous, or very unpleasant.
  synonyms: [harmful, toxic, poisonous, pernicious, deleterious]
  antonyms: [harmless, innocuous, benign]
  related: [noxiously]
  etymology: From Latin noxius, from noxa "harm," related to nocere "to hurt."
  forms: [noxiously]

- word: oblique
  pos: adjective
  ipa: /oʊˈblik/
  phonetic: oh-BLEEK
  definition: Not explicit or done directly; indirect; slanting, neither parallel nor perpendicular.
  synonyms: [indirect, roundabout, circuitous, implicit, sidelong]
  antonyms: [direct, explicit, straightforward]
  related: [obliquely, obliquity]
  etymology: From Latin obliquus "slanting, sidelong."
  forms: [obliquely]

- word: obliterate
  pos: verb
  ipa: /əˈblɪtəˌreɪt/
  phonetic: uh-BLIT-uh-rayt
  definition: To destroy utterly; wipe out; to cause to become invisible or indistinct.
  synonyms: [destroy, annihilate, eradicate, erase, efface]
  antonyms: [create, preserve, restore]
  related: [obliteration]
  etymology: From Latin obliterare "to strike out, erase," from ob- + littera "letter."
  forms: [obliterated, obliterates, obliterating, obliteration]

- word: obstreperous
  pos: adjective
  ipa: /əbˈstrɛpərəs/
  phonetic: ub-STREP-er-us
  definition: Noisy and difficult to control; unruly.
  synonyms: [unruly, boisterous, rowdy, disorderly, clamorous]
  antonyms: [docile, quiet, compliant]
  related: [obstreperousness]
  etymology: From Latin obstreperus "clamorous," from obstrepere "to make a noise against."
  forms: [obstreperously]

- word: obtrusive
  pos: adjective
  ipa: /əbˈtrusɪv/
  phonetic: ub-TROO-siv
  definition: Noticeable or prominent in an unwelcome or intrusive way.
  synonyms: [conspicuous, intrusive, prominent, blatant, interfering]
  antonyms: [unobtrusive, inconspicuous, discreet]
  related: [obtrude, obtrusiveness]
  etymology: From Latin obtrudere "to thrust upon," from ob- + trudere "to push."
  forms: [obtrusively, obtrusiveness]

- word: obtuse
  pos: adjective
  ipa: /əbˈtus/
  phonetic: ub-TOOSS
  definition: Annoyingly insensitive or slow to understand; (of an angle) more than 90 degrees.
  synonyms: [slow-witted, dull, dense, imperceptive, insensitive]
  antonyms: [astute, perceptive, sharp]
  related: [obtuseness]
  etymology: From Latin obtusus "blunted, dull," from obtundere "to beat against."
  forms: [obtuseness, obtusely]

- word: ocular
  pos: adjective
  ipa: /ˈɑkjələr/
  phonetic: OK-yuh-lur
  definition: Of or connected with the eyes or vision; perceived by sight.
  synonyms: [visual, optic, optical, ophthalmic]
  antonyms: []
  related: [oculist]
  etymology: From Latin ocularis, from oculus "eye."

- word: odious
  pos: adjective
  ipa: /ˈoʊdiəs/
  phonetic: OH-dee-us
  definition: Extremely unpleasant; repulsive and deserving hatred.
  synonyms: [repugnant, abhorrent, detestable, loathsome, hateful]
  antonyms: [delightful, pleasant, lovable]
  related: [odium, odiousness]
  etymology: From Latin odiosus, from odium "hatred."
  forms: [odiously, odiousness]

- word: ominous
  pos: adjective
  ipa: /ˈɑmənəs/
  phonetic: OM-uh-nus
  definition: Giving the impression that something bad or unpleasant is going to happen; threatening.
  synonyms: [threatening, menacing, foreboding, portentous, sinister]
  antonyms: [auspicious, promising, propitious]
  related: [omen, ominously]
  etymology: From Latin ominosus, from omen "portent."
  forms: [ominously]

- word: opportune
  pos: adjective
  ipa: /ˌɑpərˈtun/
  phonetic: op-er-TOON
  definition: Well-chosen or particularly favorable for a purpose; timely.
  synonyms: [timely, propitious, auspicious, favorable, convenient]
  antonyms: [inopportune, untimely, inconvenient]
  related: [opportunely, opportunism]
  etymology: From Latin opportunus, from ob portum "toward the harbor," originally describing a wind blowing toward port.
  forms: [opportunely]

- word: opprobrium
  pos: noun
  ipa: /əˈproʊbriəm/
  phonetic: uh-PROH-bree-um
  definition: Harsh criticism or public disgrace arising from shameful conduct.
  synonyms: [censure, condemnation, obloquy, disgrace, ignominy]
  antonyms: [praise, acclaim, honor]
  related: [opprobrious]
  etymology: From Latin opprobrium "infamy, reproach," from opprobrare "to reproach."

- word: opulent
  pos: adjective
  ipa: /ˈɑpjələnt/
  phonetic: OP-yuh-lunt
  definition: Ostentatiously rich and luxurious; wealthy; abundant.
  synonyms: [luxurious, lavish, sumptuous, affluent, plush]
  antonyms: [squalid, austere, impoverished]
  related: [opulence, opulently]
  etymology: From Latin opulentus "wealthy," from opes "wealth, resources."
  forms: [opulence, opulently]

- word: ornate
  pos: adjective
  ipa: /ɔrˈneɪt/
  phonetic: or-NAYT
  definition: Elaborately or excessively decorated; (of style) using unusual words and complex constructions.
  synonyms: [elaborate, ornamented, florid, baroque, flamboyant]
  antonyms: [plain, austere, simple]
  related: [ornately, ornateness]
  etymology: From Latin ornatus "adorned," from ornare "to adorn."
  forms: [ornately]

- word: orthodox
  pos: adjective
  ipa: /ˈɔrθəˌdɑks/
  phonetic: OR-thuh-doks
  definition: Conforming to established or traditional beliefs, standards, or doctrines.
  synonyms: [conventional, traditional, accepted, mainstream, conservative]
  antonyms: [unorthodox, heterodox, heretical]
  related: [orthodoxy]
  etymology: From Greek orthodoxos, from orthos "right, straight" + doxa "opinion."
  forms: [orthodoxy]
  lowercase_only: true

- word: oscillate
  pos: verb
  ipa: /ˈɑsəˌleɪt/
  phonetic: OS-uh-layt
  definition: To waver between opinions, feelings, or courses of action; to swing back and forth.
  synonyms: [vacillate, waver, fluctuate, swing, seesaw]
  antonyms: [settle, stabilize]
  related: [oscillation]
  etymology: From Latin oscillare "to swing."
  forms: [oscillated, oscillates, oscillating, oscillation]

- word: ostensible
  pos: adjective
  ipa: /ɑˈstɛnsəbəl/
  phonetic: ah-STEN-suh-bul
  definition: Stated or appearing to be true, but not necessarily so; apparent.
  synonyms: [apparent, professed, purported, seeming, avowed]
  antonyms: [real, genuine, actual]
  related: [ostensibly]
  etymology: From French, from Latin ostendere "to show."
  forms: [ostensibly]

- word: pacific
  pos: adjective
  ipa: /pəˈsɪfɪk/
  phonetic: puh-SIF-ik
  definition: Peaceful in character or intent; tending to bring about peace.
  synonyms: [peaceable, peaceful, conciliatory, irenic, placatory]
  antonyms: [belligerent, bellicose, hostile]
  related: [pacify, pacifist]
  etymology: From Latin pacificus "peacemaking," from pax "peace" + facere "to make."
  lowercase_only: true

- word: palatable
  pos: adjective
  ipa: /ˈpælətəbəl/
  phonetic: PAL-uh-tuh-bul
  definition: Acceptable or satisfactory to the mind; pleasant to taste.
  synonyms: [acceptable, agreeable, appetizing, tasty, satisfactory]
  antonyms: [unpalatable, distasteful, unacceptable]
  related: [palate]
  etymology: From palate, from Latin palatum "roof of the mouth," + -able.

- word: pallid
  pos: adjective
  ipa: /ˈpælɪd/
  phonetic: PAL-id
  definition: Pale, typically because of poor health; lacking vigor, color, or interest.
  synonyms: [pale, wan, ashen, insipid, colorless]
  antonyms: [ruddy, flushed, vibrant]
  related: [pallor]
  etymology: From Latin pallidus, from pallere "to be pale."

- word: palpable
  pos: adjective
  ipa: /ˈpælpəbəl/
  phonetic: PAL-puh-bul
  definition: So intense or obvious as to be almost felt; able to be touched.
  synonyms: [tangible, perceptible, evident, manifest, unmistakable]
  antonyms: [impalpable, intangible, imperceptible]
  related: [palpably, palpate]
  etymology: From Late Latin palpabilis, from palpare "to touch gently."
  forms: [palpably]

- word: paltry
  pos: adjective
  ipa: /ˈpɔltri/
  phonetic: PAWL-tree
  definition: Small or meager; petty or trivial.
  synonyms: [meager, trifling, negligible, measly, insignificant]
  antonyms: [substantial, considerable, generous]
  related: []

- word: panacea
  pos: noun
  ipa: /ˌpænəˈsiə/
  phonetic: pan-uh-SEE-uh
  definition: A solution or remedy for all difficulties or diseases.
  synonyms: [cure-all, elixir, nostrum, universal remedy, magic bullet]
  antonyms: []
  related: []
  etymology: From Greek panakeia, from panakēs "all-healing," from pan "all" + akos "remedy."
  forms: [panaceas]

- word: pander
  pos: verb
  ipa: /ˈpændər/
  phonetic: PAN-der
  definition: To gratify or indulge an immoral or distasteful desire, or a person with such desires.
  synonyms: [cater to, indulge, gratify, truckle, appease]
  antonyms: [resist, defy]
  related: [panderer]
  etymology: From Pandarus, who acts as go-between for the lovers in Chaucer's Troilus and Criseyde.
  forms: [pandered, panders, pandering]

- word: panegyric
  pos: noun
  ipa: /ˌpænəˈdʒɪrɪk/
  phonetic: pan-uh-JIR-ik
  definition: A public speech or published text in praise of someone or something; an elaborate encomium.
  synonyms: [eulogy, encomium, paean, tribute, accolade]
  antonyms: [diatribe, invective, condemnation]
  related: [panegyrist]
  etymology: From Greek panēgyrikos "for a public assembly," from panēgyris "general assembly."
  forms: [panegyrics]

- word: paramount
  pos: adjective
  ipa: /ˈpærəˌmaʊnt/
  phonetic: PAIR-uh-mownt
  definition: More important than anything else; supreme.
  synonyms: [supreme, foremost, preeminent, chief, cardinal]
  antonyms: [minor, secondary, trivial]
  related: [paramountcy]
  etymology: From Anglo-Norman paramont "above," from Old French par "by" + amont "above."
  lowercase_only: true

