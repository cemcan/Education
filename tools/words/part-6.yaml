  definition: Failing to observe the limits of what is permitted or appropriate; overconfident.
  synonyms: [arrogant, audacious, impertinent, forward, overbearing]
  antonyms: [modest, humble, diffident]
  related: [presumption, presumptuously]
  etymology: From Late Latin praesumptuosus, from praesumere "to take beforehand, presume."
  forms: [presumptuously, presumptuousness]

- word: pretentious
  pos: adjective
  ipa: /prɪˈtɛnʃəs/
  phonetic: prih-TEN-shus
  definition: Attempting to impress by affecting greater importance, talent, or culture than is actually possessed.
  synonyms: [affected, ostentatious, pompous, showy, highfalutin]
  antonyms: [unpretentious, modest, unassuming]
  related: [pretension, pretentiousness]
  etymology: From French prétentieux, from prétention "claim," ultimately from Latin praetendere "to stretch forth, allege."
  forms: [pretentiously, pretentiousness]

- word: privation
  pos: noun
  ipa: /praɪˈveɪʃən/
  phonetic: pry-VAY-shun
  definition: A state in which food and other essentials for well-being are lacking; hardship.
  synonyms: [deprivation, hardship, penury, destitution, want]
  antonyms: [affluence, plenty, comfort]
