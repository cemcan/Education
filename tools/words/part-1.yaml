  antonyms: [repulsion, repel]
  related: [alluring, alluringly]
  etymology: From Old French aleurer "to attract, train a falcon to the lure," from a- "to" + leurre "lure."
  forms: [allured, alluring, alluringly]

- word: aloof
  pos: adjective
  ipa: /əˈluf/
  phonetic: uh-LOOF
  definition: Not friendly or forthcoming; cool and distant, emotionally or physically detached.
  synonyms: [distant, detached, standoffish, reserved, remote]
  antonyms: [friendly, warm, approachable]
