  etymology: From Latin adeptus "having attained," past participle of adipisci "to attain," originally used of alchemists said to have found the secret of transmutation.
  forms: [adeptly, adeptness]

- word: admonition
  pos: noun
  ipa: /ˌædməˈnɪʃən/
  phonetic: ad-muh-NISH-un
