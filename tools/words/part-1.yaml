  forms: [admonitions]

- word: adroit
  pos: adjective
  ipa: /əˈdrɔɪt/
  phonetic: uh-DROYT
  definition: Clever or skillful in using the hands or mind; deft in handling situations.
  synonyms: [skillful, deft, dexterous, adept, nimble]
  antonyms: [clumsy, maladroit, inept]
  related: [adroitly, adroitness, maladroit]
