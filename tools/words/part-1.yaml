  forms: [accosted, accosts, accosting]

- word: accretion
  pos: noun
  ipa: /əˈkriʃən/
  phonetic: uh-KREE-shun
  definition: Gradual growth or increase by the addition of new layers or parts; something added in this way.
  synonyms: [accumulation, growth, buildup, increase, accrual]
  antonyms: [erosion, diminution, decrease]
  related: [accrete, accrue]
  etymology: From Latin accretio, from accrescere "to grow," from ad- "to" + crescere "to grow."
  forms: [accretions]

- word: acme
  pos: noun
  ipa: /ˈækmi/
  phonetic: AK-mee
  definition: The point at which someone or something is best, most successful, or most perfect.
  synonyms: [peak, pinnacle, zenith, apex, summit]
  antonyms: [nadir, bottom, low point]
  related: []
  etymology: From Greek akmē "highest point, prime."

- word: acquiesce
  pos: verb
  ipa: /ˌækwiˈɛs/
  phonetic: ak-wee-ESS
  definition: To accept or comply with something reluctantly but without protest.
  synonyms: [comply, consent, assent, submit, yield]
  antonyms: [resist, protest, object]
  related: [acquiescence, acquiescent]
  etymology: From Latin acquiescere "to rest, be at ease," from ad- "to" + quiescere "to rest."
  forms: [acquiesced, acquiesces, acquiescing, acquiescence]

- word: acquit
  pos: verb
  ipa: /əˈkwɪt/
  phonetic: uh-KWIT
  definition: To declare free from a criminal charge; (acquit oneself) to conduct oneself in a specified way.
  synonyms: [exonerate, clear, absolve, discharge, exculpate]
  antonyms: [convict, condemn, sentence]
  related: [acquittal]
  etymology: From Old French acquiter "to pay a debt, settle," from Latin ad- "to" + quitus "free, released."
  forms: [acquitted, acquits, acquitting, acquittal]

- word: acrid
  pos: adjective
  ipa: /ˈækrɪd/
  phonetic: AK-rid
  definition: Unpleasantly sharp, pungent, or bitter to smell or taste; harsh or bitter in temper or speech.
  synonyms: [pungent, bitter, caustic, acerbic, harsh]
  antonyms: [sweet, mild, pleasant]
  related: [acridly, acridity]
  etymology: From Latin acer, acris "sharp, pungent," formed on the model of "acid."
  forms: [acridly]

- word: acrimony
  pos: noun
  ipa: /ˈækrəˌmoʊni/
  phonetic: AK-ruh-moh-nee
