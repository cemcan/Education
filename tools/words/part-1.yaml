  definition: To agree to a demand, request, or treaty; to assume an office or position.
  synonyms: [consent, assent, agree, acquiesce, comply]
  antonyms: [refuse, reject, decline]
  related: [accession]
  etymology: From Latin accedere "to approach, assent," from ad- "to" + cedere "to go, yield."
  forms: [acceded, accedes, acceding]

- word: acclaim
  pos: verb / noun
  ipa: /əˈkleɪm/
  phonetic: uh-KLAYM
  definition: To praise enthusiastically and publicly; enthusiastic public praise.
  synonyms: [praise, applaud, hail, laud, extol]
  antonyms: [criticize, censure, disparage]
  related: [acclamation, acclaimed]
  etymology: From Latin acclamare "to shout at," from ad- "to" + clamare "to shout."
  forms: [acclaimed, acclaims, acclaiming]

- word: accolade
  pos: noun
  ipa: /ˈækəˌleɪd/
  phonetic: AK-uh-layd
