  synonyms: [honor, tribute, award, praise, commendation]
  antonyms: [criticism, censure, condemnation]
  related: []
  etymology: From French accolade "embrace," from Italian accollare "to embrace around the neck," referring to the embrace given when conferring knighthood.
  forms: [accolades]

- word: accord
  pos: noun / verb
  ipa: /əˈkɔrd/
  phonetic: uh-KORD
  definition: Agreement or harmony; an official agreement or treaty; (verb) to give or grant someone power, status, or recognition.
  synonyms: [agreement, harmony, concord, pact, grant]
  antonyms: [discord, disagreement, conflict]
  related: [accordance, concord]
