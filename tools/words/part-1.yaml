  synonyms: [unyielding, inflexible, resolute, firm, obdurate]
  antonyms: [flexible, yielding, irresolute]
  related: [adamantly, adamantine]
  etymology: From Greek adamas "untamable, invincible," later the name of a legendary hard stone, from a- "not" + daman "to tame."
