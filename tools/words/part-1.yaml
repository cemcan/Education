# GRE vocabulary, part 1. Examples are added by build_words.py; never write them here.
words:
- word: abase
  pos: verb
  ipa: /əˈbeɪs/
  phonetic: uh-BAYS
  definition: To lower in rank, dignity, or esteem; to humiliate or degrade.
  synonyms: [humiliate, degrade, debase, demean, belittle]
  antonyms: [elevate, exalt, honor]
  related: [abasement]
  etymology: From Old French abaissier "to lower," from Late Latin bassus "low."
  forms: [abased, abases, abasing, abasement]

- word: abash
  pos: verb
  ipa: /əˈbæʃ/
  phonetic: uh-BASH
  definition: To make someone feel embarrassed, ashamed, or disconcerted.
  synonyms: [embarrass, shame, disconcert, discomfit, mortify]
  antonyms: [embolden, encourage]
  related: [abashed, unabashed]
  etymology: From Old French esbaïss-, stem of esbaïr "to astonish, dismay."
  forms: [abashed, abashes, abashing]

- word: abdicate
  pos: verb
  ipa: /ˈæbdɪˌkeɪt/
  phonetic: AB-dih-kayt
  definition: To formally give up a throne or position of power; to fail to fulfill a duty or responsibility.
  synonyms: [renounce, relinquish, resign, abandon, forsake]
  antonyms: [assume, claim, retain]
  related: [abdication]
  etymology: From Latin abdicare "to disown, renounce," from ab- "away" + dicare "to proclaim."
  forms: [abdicated, abdicates, abdicating, abdication]

- word: aberration
  pos: noun
  ipa: /ˌæbəˈreɪʃən/
  phonetic: ab-uh-RAY-shun
  definition: A departure from what is normal, usual, or expected, often an unwelcome one.
  synonyms: [anomaly, deviation, irregularity, departure, abnormality]
  antonyms: [norm, conformity, regularity]
  related: [aberrant, aberrational]
  etymology: From Latin aberrare "to wander away," from ab- "away" + errare "to stray."
  forms: [aberrations]

- word: abeyance
  pos: noun
  ipa: /əˈbeɪəns/
  phonetic: uh-BAY-unss
  definition: A state of temporary disuse or suspension.
  synonyms: [suspension, dormancy, latency, remission, hiatus]
  antonyms: [continuation, activity, operation]
  related: []
  etymology: From Anglo-French abeiance "expectation," from Old French abeer "to gape after, aspire to."

- word: abhor
  pos: verb
  ipa: /æbˈhɔr/
  phonetic: ab-HOR
  definition: To regard with disgust and hatred; to detest.
  synonyms: [detest, loathe, abominate, despise, execrate]
  antonyms: [love, admire, adore]
  related: [abhorrent, abhorrence]
  etymology: From Latin abhorrere "to shrink back from in dread," from ab- "away" + horrere "to bristle, shudder."
  forms: [abhorred, abhors, abhorring]

- word: abject
  pos: adjective
  ipa: /ˈæbdʒɛkt/
  phonetic: AB-jekt
  definition: Extremely bad, miserable, or hopeless; (of a person or behavior) completely lacking pride or dignity.
  synonyms: [wretched, miserable, hopeless, servile, contemptible]
  antonyms: [proud, dignified, exalted]
  related: [abjectly, abjection]
  etymology: From Latin abjectus "cast away," past participle of abicere, from ab- "away" + jacere "to throw."
  forms: [abjectly]

- word: abjure
  pos: verb
  ipa: /æbˈdʒʊr/
  phonetic: ab-JOOR
  definition: To solemnly renounce a belief, cause, or claim; to reject formally.
  synonyms: [renounce, repudiate, forswear, recant, abandon]
  antonyms: [embrace, affirm, espouse]
  related: [abjuration]
  etymology: From Latin abjurare "to deny on oath," from ab- "away" + jurare "to swear."
  forms: [abjured, abjures, abjuring]

- word: abominate
  pos: verb
  ipa: /əˈbɑməˌneɪt/
  phonetic: uh-BOM-uh-nayt
  definition: To detest intensely; to loathe.
  synonyms: [loathe, detest, abhor, despise, execrate]
  antonyms: [love, adore, cherish]
  related: [abomination, abominable]
  etymology: From Latin abominari "to shun as an ill omen," from ab- "away" + omen.
  forms: [abominated, abominates, abominating]

- word: abortive
  pos: adjective
  ipa: /əˈbɔrtɪv/
  phonetic: uh-BOR-tiv
  definition: Failing to produce the intended result; unsuccessful.
  synonyms: [unsuccessful, failed, futile, fruitless, vain]
  antonyms: [successful, fruitful, effective]
  related: [abortively]
  etymology: From Latin abortivus, from aboriri "to miscarry," from ab- "away" + oriri "to arise, be born."
  forms: [abortively]

- word: abound
  pos: verb
  ipa: /əˈbaʊnd/
  phonetic: uh-BOWND
  definition: To exist in large numbers or amounts; to be plentiful.
  synonyms: [proliferate, teem, swarm, flourish, overflow]
  antonyms: [lack, dwindle]
  related: [abundant, abundance]
  etymology: From Latin abundare "to overflow," from ab- "away" + undare "to rise in waves" (unda "wave").
  forms: [abounded, abounds, abounding]

- word: abscond
  pos: verb
  ipa: /æbˈskɑnd/
  phonetic: ab-SKOND
  definition: To leave hurriedly and secretly, typically to escape detection or arrest, often with something stolen.
  synonyms: [flee, bolt, decamp, escape, run off]
  antonyms: [remain, stay, surrender]
  related: [absconder]
  etymology: From Latin abscondere "to hide away," from abs- "away" + condere "to put, store."
  forms: [absconded, absconds, absconding]

- word: absolution
  pos: noun
  ipa: /ˌæbsəˈluʃən/
  phonetic: ab-suh-LOO-shun
  definition: Formal release from guilt, obligation, or punishment; forgiveness.
  synonyms: [forgiveness, pardon, exoneration, remission, acquittal]
  antonyms: [condemnation, blame, punishment]
  related: [absolve]
  etymology: From Latin absolutio "acquittal," from absolvere "to set free."

- word: absolve
  pos: verb
  ipa: /æbˈzɑlv/
  phonetic: ab-ZOLV
  definition: To declare free from guilt, blame, or responsibility.
  synonyms: [exonerate, acquit, pardon, exculpate, clear]
  antonyms: [blame, condemn, convict]
  related: [absolution]
  etymology: From Latin absolvere "to set free," from ab- "from" + solvere "to loosen."
  forms: [absolved, absolves, absolving]

- word: abstemious
  pos: adjective
  ipa: /æbˈstimiəs/
  phonetic: ab-STEE-mee-us
  definition: Moderate or restrained, especially in eating and drinking; not self-indulgent.
  synonyms: [temperate, abstinent, ascetic, frugal, self-denying]
  antonyms: [gluttonous, intemperate, self-indulgent]
  related: [abstemiously, abstemiousness]
  etymology: From Latin abstemius, from abs- "from" + temetum "strong drink."
  forms: [abstemiously, abstemiousness]

- word: abstinence
  pos: noun
  ipa: /ˈæbstənəns/
  phonetic: AB-stuh-nunss
  definition: The practice of refraining from indulging in something, especially alcohol, food, or sex.
  synonyms: [abstention, self-denial, temperance, sobriety, restraint]
  antonyms: [indulgence, excess, overindulgence]
  related: [abstinent, abstain]
  etymology: From Latin abstinentia, from abstinere "to hold back," from abs- "from" + tenere "to hold."
  forms: [abstinent]

- word: abyss
  pos: noun
  ipa: /əˈbɪs/
  phonetic: uh-BISS
  definition: A deep or seemingly bottomless chasm; a vast, immeasurable depth or a catastrophic situation.
  synonyms: [chasm, gulf, void, pit, depths]
  antonyms: [summit, peak]
  related: [abysmal, abyssal]
  etymology: From Greek abyssos "bottomless," from a- "without" + byssos "bottom."
  forms: [abysses]

- word: accede
  pos: verb
  ipa: /ækˈsid/
