  synonyms: [bitterness, rancor, animosity, hostility, resentment]
  antonyms: [goodwill, harmony, amity]
  related: [acrimonious, acrimoniously]
  etymology: From Latin acrimonia "sharpness," from acer "sharp."
  forms: [acrimonious, acrimoniously]

- word: actuate
  pos: verb
  ipa: /ˈæktʃuˌeɪt/
  phonetic: AK-choo-ayt
