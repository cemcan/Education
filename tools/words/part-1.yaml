  antonyms: [unfriendly, surly, aloof]
  related: [affably, affability]
  etymology: From Latin affabilis "easy to speak to," from ad- "to" + fari "to speak."
  forms: [affably, affability]

- word: affectation
  pos: noun
  ipa: /ˌæfɛkˈteɪʃən/
  phonetic: af-ek-TAY-shun
  definition: Behavior, speech, or manner that is artificial and designed to impress.
  synonyms: [pretension, artificiality, pose, airs, mannerism]
  antonyms: [naturalness, sincerity, genuineness]
  related: [affected, affect]
  etymology: From Latin affectatio "a striving after," from affectare "to aim at, pretend to have."
  forms: [affectations]

- word: affinity
  pos: noun
  ipa: /əˈfɪnɪti/
  phonetic: uh-FIN-ih-tee
  definition: A natural liking for or sympathy with someone or something; a close similarity or resemblance.
  synonyms: [rapport, kinship, sympathy, fondness, resemblance]
  antonyms: [aversion, antipathy, dissimilarity]
