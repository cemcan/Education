  synonyms: [artistic, tasteful, decorative, ornamental, style]
  antonyms: [unattractive, inartistic]
  related: [aesthetically, aesthetics, aesthete]
  etymology: From Greek aisthētikos "of sense perception," from aisthanesthai "to perceive."
