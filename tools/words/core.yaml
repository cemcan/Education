# High-frequency GRE vocabulary.
# `forms` lists inflections searched for in the corpus; `exclude` drops corpus
# sentences containing a substring (for unwanted senses or bad splits).
# Examples are added by build_words.py; never write them here.
words:
- word: abate
  pos: verb
  ipa: /əˈbeɪt/
  phonetic: uh-BAYT
  definition: To become less intense or widespread; to lessen or reduce something.
  synonyms: [subside, diminish, wane, ebb, let up]
  antonyms: [intensify, escalate, increase]
  related: [abatement, unabated]
  etymology: From Old French abatre "to beat down," from Latin ad- "to" + battuere "to beat" (also the source of "battle" and "batter").
  forms: [abated, abates, abating]

- word: abstruse
  pos: adjective
  ipa: /æbˈstrus/
  phonetic: ab-STROOS
  definition: Difficult to understand; obscure.
  synonyms: [recondite, esoteric, arcane, obscure, impenetrable]
  antonyms: [clear, simple, accessible]
  related: [abstruseness]
  etymology: From Latin abstrusus "concealed," past participle of abstrudere "to thrust away, hide."

- word: acumen
  pos: noun
  ipa: /əˈkjumən/
  phonetic: AK-yuh-mun
  definition: The ability to make good judgments and quick, accurate decisions, especially in a particular field.
  synonyms: [shrewdness, astuteness, discernment, insight, sharpness]
  antonyms: [obtuseness, ineptitude]
  related: [acute, acuity]
  etymology: From Latin acumen "a point, sharpness," from acuere "to sharpen." The same root gives "acute" and "acupuncture."

- word: admonish
  pos: verb
  ipa: /ədˈmɑnɪʃ/
  phonetic: ad-MON-ish
  definition: To warn or reprimand someone firmly, often gently but earnestly; to advise against something.
  synonyms: [reprimand, rebuke, caution, chide, reprove]
  antonyms: [praise, commend, encourage]
  related: [admonition, admonitory]
  etymology: From Latin admonere "to remind, warn," from ad- "to" + monere "to warn" (compare "monitor").
  forms: [admonished, admonishes, admonishing]

- word: alacrity
  pos: noun
  ipa: /əˈlækrɪti/
  phonetic: uh-LAK-ri-tee
  definition: Brisk and cheerful readiness; eager willingness to do something.
  synonyms: [eagerness, readiness, enthusiasm, promptness, zeal]
  antonyms: [reluctance, apathy, sluggishness]
  related: []
  etymology: From Latin alacritas, from alacer "lively, brisk."

- word: ameliorate
  pos: verb
  ipa: /əˈmiljəreɪt/
  phonetic: uh-MEEL-yuh-rayt
  definition: To make something bad or unsatisfactory better.
  synonyms: [improve, alleviate, mitigate, better, ease]
  antonyms: [worsen, aggravate, exacerbate]
  related: [amelioration, ameliorative]
  etymology: From French améliorer, from Latin melior "better."
  forms: [ameliorated, ameliorates, ameliorating, amelioration]

- word: anachronism
  pos: noun
  ipa: /əˈnækrəˌnɪzəm/
  phonetic: uh-NAK-ruh-niz-um
  definition: Something that belongs or seems to belong to another time, especially something conspicuously old-fashioned.
  synonyms: [archaism, relic, throwback, solecism]
  antonyms: [modernity]
  related: [anachronistic]
  etymology: From Greek anakhronismos, from ana- "backward, against" + khronos "time."
  forms: [anachronisms, anachronistic]

- word: anomaly
  pos: noun
  ipa: /əˈnɑməli/
  phonetic: uh-NOM-uh-lee
  definition: Something that deviates from what is standard, normal, or expected.
  synonyms: [aberration, irregularity, oddity, exception, deviation]
  antonyms: [norm, rule, regularity]
  related: [anomalous]
  etymology: From Greek anōmalia "unevenness," from an- "not" + homalos "even."
  forms: [anomalies, anomalous]

- word: antipathy
  pos: noun
  ipa: /ænˈtɪpəθi/
  phonetic: an-TIP-uh-thee
  definition: A deep-seated feeling of dislike or aversion.
  synonyms: [hostility, aversion, animosity, enmity, antagonism]
  antonyms: [affinity, sympathy, liking]
  related: [antipathetic]
  etymology: From Greek antipatheia, from anti- "against" + pathos "feeling."
  forms: [antipathies]

- word: apathy
  pos: noun
  ipa: /ˈæpəθi/
  phonetic: AP-uh-thee
  definition: Lack of interest, enthusiasm, or concern.
  synonyms: [indifference, unconcern, listlessness, torpor, ennui]
  antonyms: [enthusiasm, passion, concern]
  related: [apathetic, apathetically]
  etymology: From Greek apatheia, from a- "without" + pathos "feeling." The Stoics used it approvingly, for freedom from passion.
  forms: [apathetic]

- word: appease
  pos: verb
  ipa: /əˈpiz/
  phonetic: uh-PEEZ
  definition: To pacify or placate someone by giving in to their demands.
  synonyms: [placate, pacify, mollify, conciliate, propitiate]
  antonyms: [provoke, antagonize, inflame]
  related: [appeasement]
  etymology: From Old French apaisier "to bring to peace," from a pais "to peace," from Latin pax.
  forms: [appeased, appeases, appeasing, appeasement]

- word: ardent
  pos: adjective
  ipa: /ˈɑrdənt/
  phonetic: AR-dunt
  definition: Enthusiastic or passionate; burning with feeling.
  synonyms: [fervent, passionate, zealous, eager, impassioned]
  antonyms: [apathetic, indifferent, cool]
  related: [ardor, ardently]
  etymology: From Latin ardere "to burn" (also in "arson").
  forms: [ardently, ardour, ardor]

- word: arduous
  pos: adjective
  ipa: /ˈɑrdʒuəs/
  phonetic: AR-joo-us
  definition: Involving or requiring strenuous effort; difficult and tiring.
  synonyms: [onerous, strenuous, grueling, laborious, taxing]
  antonyms: [easy, effortless, facile]
  related: [arduously, arduousness]
  etymology: From Latin arduus "steep, high, difficult."

- word: ascetic
  pos: adjective / noun
  ipa: /əˈsɛtɪk/
  phonetic: uh-SET-ik
  definition: Characterized by severe self-discipline and abstention from indulgence; a person who lives this way.
  synonyms: [austere, abstemious, self-denying, spartan, monastic]
  antonyms: [hedonistic, self-indulgent, sybaritic]
  related: [asceticism]
  etymology: From Greek askētikos, from askētēs "monk, hermit," originally "one who exercises, an athlete," from askein "to exercise, train."
  forms: [ascetics, asceticism]

- word: assuage
  pos: verb
  ipa: /əˈsweɪdʒ/
  phonetic: uh-SWAYJ
  definition: To make an unpleasant feeling less intense; to satisfy an appetite or desire.
  synonyms: [relieve, soothe, allay, alleviate, mitigate]
  antonyms: [aggravate, intensify, worsen]
  related: []
  etymology: From Old French assouagier, from Latin ad- "to" + suavis "sweet."
  forms: [assuaged, assuages, assuaging]

- word: audacious
  pos: adjective
  ipa: /ɔˈdeɪʃəs/
  phonetic: aw-DAY-shus
  definition: Showing a willingness to take bold risks; sometimes, showing impudent lack of respect.
  synonyms: [bold, daring, intrepid, brazen, impudent]
  antonyms: [timid, cautious, meek]
  related: [audacity, audaciously]
  etymology: From Latin audax "bold," from audere "to dare."
  forms: [audacity, audaciously]
  exclude: ["woman-like, a lover of young men"]

- word: austere
  pos: adjective
  ipa: /ɔˈstɪr/
  phonetic: aw-STEER
  definition: Severe or strict in manner or attitude; having no comforts or luxuries; plain.
  synonyms: [stern, severe, spartan, ascetic, stark]
  antonyms: [lavish, luxurious, indulgent]
  related: [austerity, austerely]
  etymology: From Greek austēros "harsh, bitter," originally describing a taste that makes the tongue dry.
  forms: [austerity, austerely]

- word: belie
  pos: verb
  ipa: /bɪˈlaɪ/
  phonetic: bih-LIE
  definition: To give a false impression of something; to contradict or show to be false.
  synonyms: [contradict, disguise, misrepresent, refute, disprove]
  antonyms: [confirm, attest, corroborate]
  related: []
  etymology: Old English belēogan "to deceive by lying," from be- + lēogan "to lie."
  forms: [belied, belies, belying]

- word: benevolent
  pos: adjective
  ipa: /bəˈnɛvələnt/
  phonetic: buh-NEV-uh-lunt
  definition: Well meaning and kindly; serving a charitable rather than profit-making purpose.
  synonyms: [kind, charitable, altruistic, beneficent, magnanimous]
  antonyms: [malevolent, cruel, spiteful]
  related: [benevolence, benevolently]
  etymology: From Latin bene "well" + volens "wishing," from velle "to wish."
  forms: [benevolence, benevolently]

- word: bolster
  pos: verb
  ipa: /ˈboʊlstər/
  phonetic: BOHL-ster
  definition: To support or strengthen; to prop up.
  synonyms: [reinforce, buttress, shore up, strengthen, boost]
  antonyms: [undermine, weaken, sap]
  related: []
  etymology: Old English bolster "long pillow, cushion." The verb sense "prop up," as with a pillow, dates from the 1500s.
  forms: [bolstered, bolsters, bolstering]
  exclude: ["wanted a bolster placed under him", "sort of bolster", "bolster and", "on the bolster", "the bolster"]

- word: capricious
  pos: adjective
  ipa: /kəˈprɪʃəs/
  phonetic: kuh-PRISH-us
  definition: Given to sudden and unaccountable changes of mood or behavior.
  synonyms: [fickle, mercurial, erratic, whimsical, volatile]
  antonyms: [steady, consistent, constant]
  related: [caprice, capriciously]
  etymology: From Italian capriccio "a sudden start," popularly linked with capra "goat," as if moving with a goat's unpredictable leaps.
  forms: [caprice, capriciously, capriciousness]

- word: castigate
  pos: verb
  ipa: /ˈkæstɪɡeɪt/
  phonetic: KAS-tih-gayt
  definition: To reprimand someone severely.
  synonyms: [chastise, berate, rebuke, upbraid, excoriate]
  antonyms: [praise, commend, laud]
  related: [castigation]
  etymology: From Latin castigare "to correct, punish," from castus "pure" (also the source of "chaste").
  forms: [castigated, castigates, castigating, castigation]

- word: caustic
  pos: adjective
  ipa: /ˈkɔstɪk/
  phonetic: KAW-stik
  definition: Able to burn or corrode organic tissue by chemical action; sarcastic in a scathing and bitter way.
  synonyms: [acerbic, scathing, mordant, biting, trenchant]
  antonyms: [mild, gentle, soothing]
  related: [caustically]
  etymology: From Greek kaustikos "capable of burning," from kaiein "to burn" (also in "cauterize").

- word: cogent
  pos: adjective
  ipa: /ˈkoʊdʒənt/
  phonetic: KOH-junt
  definition: Clear, logical, and convincing.
  synonyms: [compelling, persuasive, convincing, forceful, sound]
  antonyms: [weak, unconvincing, specious]
  related: [cogency, cogently]
  etymology: From Latin cogere "to compel," from co- "together" + agere "to drive."
  forms: [cogency, cogently]

- word: complacent
  pos: adjective
  ipa: /kəmˈpleɪsənt/
  phonetic: kum-PLAY-sunt
  definition: Showing smug or uncritical satisfaction with oneself or one's achievements.
  synonyms: [smug, self-satisfied, self-congratulatory, unconcerned]
  antonyms: [vigilant, dissatisfied, self-critical]
  related: [complacency, complacently]
  etymology: From Latin complacere "to please very much." In the 1600s it meant simply "pleasing"; the sense of smugness came later.
  forms: [complacency, complacently]
  exclude: ["we would be very expensive"]

- word: conciliatory
  pos: adjective
  ipa: /kənˈsɪliəˌtɔri/
  phonetic: kun-SIL-ee-uh-tor-ee
  definition: Intended or likely to placate or pacify.
  synonyms: [placatory, appeasing, pacifying, propitiatory, peacemaking]
  antonyms: [antagonistic, confrontational, provocative]
  related: [conciliate, conciliation]
  etymology: From Latin conciliare "to bring together, unite," from concilium "council."
  forms: [conciliation, conciliate]

- word: corroborate
  pos: verb
  ipa: /kəˈrɑbəreɪt/
  phonetic: kuh-ROB-uh-rayt
  definition: To confirm or give support to a statement, theory, or finding.
  synonyms: [confirm, substantiate, verify, validate, bear out]
  antonyms: [contradict, refute, disprove]
  related: [corroboration, corroborative]
  etymology: From Latin corroborare "to strengthen," from com- + robur "strength, oak" (also in "robust").
  forms: [corroborated, corroborates, corroborating, corroboration]

- word: credulous
  pos: adjective
  ipa: /ˈkrɛdʒələs/
  phonetic: KREJ-uh-lus
  definition: Having or showing too great a readiness to believe things.
  synonyms: [gullible, naive, trusting, unsuspecting, ingenuous]
  antonyms: [skeptical, suspicious, incredulous]
  related: [credulity, incredulous]
  etymology: From Latin credulus "trusting," from credere "to believe" (also in "credit" and "creed").
  forms: [credulity]
  exclude: ["though our credulity is limited that"]

- word: culpable
  pos: adjective
  ipa: /ˈkʌlpəbəl/
  phonetic: KUL-puh-bul
  definition: Deserving blame.
  synonyms: [blameworthy, guilty, at fault, responsible, reprehensible]
  antonyms: [blameless, innocent, guiltless]
  related: [culpability, culprit]
  etymology: From Latin culpabilis, from culpa "fault, blame," as in the phrase mea culpa.
  forms: [culpability]

- word: dearth
  pos: noun
  ipa: /dɜrθ/
  phonetic: DURTH
  definition: A scarcity or lack of something.
  synonyms: [paucity, scarcity, shortage, lack, deficiency]
  antonyms: [abundance, plethora, surplus]
  related: []
  etymology: Middle English derthe, from dear in the old sense "costly" + the noun suffix -th. When food was dear, it was scarce.

- word: deference
  pos: noun
  ipa: /ˈdɛfərəns/
  phonetic: DEF-er-uns
  definition: Humble submission and respect.
  synonyms: [respect, regard, submission, compliance, esteem]
  antonyms: [disrespect, defiance, contempt]
  related: [defer, deferential]
  etymology: From French déférence, from déférer "to yield," from Latin deferre "to carry down, refer."
  forms: [deferential, deferentially]

- word: deleterious
  pos: adjective
  ipa: /ˌdɛləˈtɪriəs/
  phonetic: del-ih-TEER-ee-us
  definition: Causing harm or damage.
  synonyms: [harmful, damaging, detrimental, injurious, pernicious]
  antonyms: [beneficial, salutary, harmless]
  related: []
  etymology: From Greek dēlētērios "noxious," from dēleisthai "to hurt, damage."

- word: desultory
  pos: adjective
  ipa: /ˈdɛsəlˌtɔri/
  phonetic: DES-ul-tor-ee
  definition: Lacking a plan, purpose, or enthusiasm; jumping from one thing to another.
  synonyms: [casual, cursory, aimless, haphazard, random]
  antonyms: [methodical, systematic, purposeful]
  related: [desultorily]
  etymology: From Latin desultorius "of a circus rider who leaps from horse to horse," from desilire "to leap down."
  forms: [desultorily]

- word: didactic
  pos: adjective
  ipa: /daɪˈdæktɪk/
  phonetic: die-DAK-tik
  definition: Intended to teach, particularly in having moral instruction as an ulterior motive; sometimes, overly preachy.
  synonyms: [instructive, educational, pedagogic, moralizing, preachy]
  antonyms: [entertaining]
  related: [didactically, didacticism]
  etymology: From Greek didaktikos "apt at teaching," from didaskein "to teach."

- word: diffident
  pos: adjective
  ipa: /ˈdɪfɪdənt/
  phonetic: DIF-ih-dunt
  definition: Modest or shy because of a lack of self-confidence.
  synonyms: [shy, timid, reserved, unassertive, self-effacing]
  antonyms: [confident, assertive, bold]
  related: [diffidence, diffidently]
  etymology: From Latin diffidere "to mistrust," from dis- "not" + fidere "to trust." To lack trust in oneself.
  forms: [diffidence, diffidently]

- word: dilettante
  pos: noun
  ipa: /ˌdɪləˈtɑnt/
  phonetic: dil-ih-TAHNT
  definition: A person who cultivates an area of interest, such as the arts, without real commitment or knowledge.
  synonyms: [dabbler, amateur, trifler, layman]
  antonyms: [professional, expert, connoisseur]
  related: [dilettantism]
  etymology: From Italian dilettante "lover (of an art)," from dilettare "to delight." Originally a compliment; by the 1800s it implied superficiality.
  forms: [dilettanti, dilettantes, dilettantism]

- word: disparage
  pos: verb
  ipa: /dɪˈspærɪdʒ/
  phonetic: dih-SPAIR-ij
  definition: To regard or represent as being of little worth; to belittle.
  synonyms: [belittle, denigrate, deprecate, decry, run down]
  antonyms: [praise, extol, laud]
  related: [disparagement, disparaging]
  etymology: From Old French desparagier "to marry someone of unequal rank," from des- "apart" + parage "equality of rank," from Latin par "equal."
  forms: [disparaged, disparages, disparaging, disparagement]

- word: dissemble
  pos: verb
  ipa: /dɪˈsɛmbəl/
  phonetic: dih-SEM-bul
  definition: To conceal one's true motives, feelings, or beliefs; to disguise or feign.
  synonyms: [feign, pretend, dissimulate, mask, deceive]
  antonyms: [reveal, disclose, avow]
  related: [dissembler]
  etymology: An alteration of Old French dessembler, influenced by "resemble"; from Latin dissimulare "to disguise."
  forms: [dissembled, dissembles, dissembling]
  exclude: ["he likewise knew that to mankind"]

- word: dogmatic
  pos: adjective
  ipa: /dɔɡˈmætɪk/
  phonetic: dog-MAT-ik
  definition: Inclined to lay down principles as undeniably true, without consideration of evidence or the opinions of others.
  synonyms: [opinionated, doctrinaire, inflexible, rigid, peremptory]
  antonyms: [open-minded, flexible, undogmatic]
  related: [dogma, dogmatism]
  etymology: From Greek dogma "opinion, decree," from dokein "to seem good, think."
  forms: [dogmatism, dogmatically]

- word: efficacy
  pos: noun
  ipa: /ˈɛfɪkəsi/
  phonetic: EF-ih-kuh-see
  definition: The ability to produce a desired or intended result.
  synonyms: [effectiveness, potency, power, efficiency, success]
  antonyms: [ineffectiveness, futility]
  related: [efficacious]
  etymology: From Latin efficacia, from efficere "to accomplish."
  forms: [efficacious]

- word: effrontery
  pos: noun
  ipa: /ɪˈfrʌntəri/
  phonetic: ih-FRUN-tuh-ree
  definition: Insolent or impertinent behavior; shameless boldness.
  synonyms: [impudence, audacity, gall, temerity, insolence]
  antonyms: [respect, politeness, timidity]
  related: []
  etymology: From French effronterie, from Late Latin effrons "shameless," from ex- "out" + frons "forehead." Barefaced, putting one's forehead forward.
  exclude: ["smuggled themselves in sure"]

- word: eloquent
  pos: adjective
  ipa: /ˈɛləkwənt/
  phonetic: EL-uh-kwunt
  definition: Fluent or persuasive in speaking or writing; clearly expressive.
  synonyms: [articulate, fluent, expressive, persuasive, silver-tongued]
  antonyms: [inarticulate, halting, tongue-tied]
  related: [eloquence, eloquently]
  etymology: From Latin eloqui "to speak out," from e- "out" + loqui "to speak" (compare "loquacious").
  forms: [eloquence, eloquently]

- word: emulate
  pos: verb
  ipa: /ˈɛmjəleɪt/
  phonetic: EM-yuh-layt
  definition: To match or surpass a person or achievement, typically by imitation.
  synonyms: [imitate, copy, mirror, follow, rival]
  antonyms: []
  related: [emulation, emulous]
  etymology: From Latin aemulari "to rival," from aemulus "rivaling."
  forms: [emulated, emulates, emulating, emulation]

- word: enervate
  pos: verb
  ipa: /ˈɛnərveɪt/
  phonetic: EN-er-vayt
  definition: To cause someone to feel drained of energy or vitality; to weaken. (It does not mean "energize.")
  synonyms: [exhaust, debilitate, sap, enfeeble, weaken]
  antonyms: [invigorate, energize, fortify]
  related: [enervation]
  etymology: From Latin enervare "to weaken," literally "to remove the sinews," from e- "out" + nervus "sinew."
  forms: [enervated, enervates, enervating, enervation]

- word: enigma
  pos: noun
  ipa: /ɪˈnɪɡmə/
  phonetic: ih-NIG-muh
  definition: A person or thing that is mysterious, puzzling, or difficult to understand.
  synonyms: [mystery, puzzle, riddle, conundrum, paradox]
  antonyms: []
  related: [enigmatic, enigmatically]
  etymology: From Greek ainigma "riddle," from ainissesthai "to speak in riddles."
  forms: [enigmas, enigmatic, enigmatical]
  exclude: ["you see, I suspect..."]

- word: ephemeral
  pos: adjective
  ipa: /ɪˈfɛmərəl/
  phonetic: ih-FEM-er-ul
  definition: Lasting for a very short time.
  synonyms: [transient, fleeting, evanescent, transitory, momentary]
  antonyms: [permanent, enduring, perennial]
  related: [ephemera]
  etymology: From Greek ephēmeros "lasting only a day," from epi- "on" + hēmera "day."

- word: equanimity
  pos: noun
  ipa: /ˌikwəˈnɪmɪti/
  phonetic: ek-wuh-NIM-ih-tee
  definition: Mental calmness and composure, especially in a difficult situation.
  synonyms: [composure, calm, serenity, poise, imperturbability]
  antonyms: [anxiety, agitation, panic]
  related: []
  etymology: From Latin aequanimitas, from aequus "even" + animus "mind."

- word: equivocate
  pos: verb
  ipa: /ɪˈkwɪvəkeɪt/
  phonetic: ih-KWIV-uh-kayt
  definition: To use ambiguous language so as to conceal the truth or avoid committing oneself.
  synonyms: [prevaricate, hedge, waffle, dodge, fudge]
  antonyms: [commit, clarify]
  related: [equivocal, equivocation]
  etymology: From Late Latin aequivocare "to call by the same name," from aequus "equal" + vocare "to call."
  forms: [equivocated, equivocates, equivocating, equivocation, equivocal]

- word: erudite
  pos: adjective
  ipa: /ˈɛrjədaɪt/
  phonetic: AIR-yuh-dite
  definition: Having or showing great knowledge or learning.
  synonyms: [learned, scholarly, knowledgeable, well-read, lettered]
  antonyms: [ignorant, uneducated, illiterate]
  related: [erudition]
  etymology: From Latin eruditus "instructed," from erudire "to polish," literally "to bring out of roughness," from e- "out" + rudis "rough, untrained" (compare "rude").
  forms: [erudition]

- word: esoteric
  pos: adjective
  ipa: /ˌɛsəˈtɛrɪk/
  phonetic: es-uh-TAIR-ik
  definition: Intended for or likely to be understood by only a small number of people with specialized knowledge.
  synonyms: [abstruse, arcane, obscure, recondite, cryptic]
  antonyms: [common, accessible, exoteric]
  related: [esoterica]
  etymology: From Greek esōterikos "belonging to an inner circle," from esōterō "further in." First applied to Pythagorean teaching meant for initiates.

- word: exacerbate
  pos: verb
  ipa: /ɪɡˈzæsərbeɪt/
  phonetic: ig-ZAS-er-bayt
  definition: To make a problem, bad situation, or negative feeling worse.
  synonyms: [aggravate, worsen, inflame, compound, intensify]
