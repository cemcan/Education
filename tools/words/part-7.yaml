  pos: adjective
  ipa: /ˈspiʃəs/
  phonetic: SPEE-shus
  definition: Superficially plausible but actually wrong; misleadingly attractive.
  synonyms: [misleading, deceptive, spurious, fallacious, plausible]
  antonyms: [valid, sound, genuine]
  related: [speciously, speciousness]
  etymology: From Latin speciosus "fair, beautiful," from species "appearance."
