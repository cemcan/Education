  definition: The quality of having strong moral principles; honesty and decency.
  synonyms: [integrity, honesty, rectitude, uprightness, virtue]
  antonyms: [dishonesty, corruption, turpitude]
  related: []
  etymology: From Latin probitas "uprightness," from probus "good, honest."

- word: prodigious
