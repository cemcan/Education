# GRE vocabulary, part 2. Examples are added by build_words.py; never write them here.
words:
- word: beneficent
  pos: adjective
  ipa: /bəˈnɛfəsənt/
  phonetic: buh-NEF-uh-sunt
  definition: Doing or producing good; actively kind and charitable.
  synonyms: [benevolent, charitable, generous, kindly, altruistic]
  antonyms: [maleficent, malevolent, harmful]
  related: [beneficence, beneficently]
  etymology: From Latin beneficus "generous, doing good," from bene "well" + facere "to do."
  forms: [beneficently, beneficence]

- word: benign
  pos: adjective
  ipa: /bɪˈnaɪn/
  phonetic: bih-NYNE
  definition: Gentle and kindly; harmless or favorable; of a disease, not malignant.
  synonyms: [kindly, gentle, harmless, innocuous, benevolent]
  antonyms: [malignant, harmful, hostile]
  related: [benignly, benignity]
  etymology: From Old French benigne, from Latin benignus "kindly," from bene "well" + a root meaning "born."
  forms: [benignly]

- word: bequeath
  pos: verb
  ipa: /bɪˈkwið/
  phonetic: bih-KWEETH
  definition: To leave property to someone by a will; to hand down or pass on to later generations.
  synonyms: [leave, will, bestow, hand down, pass on]
  antonyms: [inherit, withhold]
  related: [bequest]
  etymology: From Old English becwethan "to declare, leave by will," from be- + cwethan "to say" (compare archaic "quoth").
  forms: [bequeathed, bequeaths, bequeathing]

- word: bereft
  pos: adjective
  ipa: /bɪˈrɛft/
  phonetic: bih-REFT
  definition: Deprived of or lacking something; sad and lonely, especially after a death or loss.
  synonyms: [deprived, devoid, lacking, destitute, bereaved]
  antonyms: [endowed, possessed of]
  related: [bereave, bereavement]
  etymology: Past participle of "bereave," from Old English bereafian "to deprive, rob."

- word: beseech
  pos: verb
  ipa: /bɪˈsitʃ/
  phonetic: bih-SEECH
  definition: To ask someone urgently and fervently; to beg or implore.
  synonyms: [implore, entreat, beg, plead, supplicate]
  antonyms: [command, demand]
  related: [beseechingly]
  etymology: From Middle English bisechen, from be- (intensive) + sechen "to seek."
  forms: [beseeched, besought, beseeches, beseeching, beseechingly]

- word: besiege
  pos: verb
  ipa: /bɪˈsidʒ/
  phonetic: bih-SEEJ
  definition: To surround a place with armed forces to force surrender; to crowd around or overwhelm with requests or complaints.
  synonyms: [beleaguer, blockade, surround, assail, inundate]
  antonyms: [relieve, liberate]
  related: [siege, besieger]
  forms: [besieged, besieges, besieging]

- word: besmirch
  pos: verb
  ipa: /bɪˈsmɜrtʃ/
  phonetic: bih-SMURCH
  definition: To damage someone's reputation; literally, to soil or make dirty.
  synonyms: [sully, tarnish, defame, smear, stain]
  antonyms: [honor, vindicate, exalt]
  related: []
  etymology: From be- + "smirch" "to soil, stain."
  forms: [besmirched, besmirches, besmirching]

- word: bestow
  pos: verb
  ipa: /bɪˈstoʊ/
  phonetic: bih-STOH
  definition: To confer or present an honor, right, or gift.
  synonyms: [confer, grant, award, present, accord]
  antonyms: [withhold, withdraw, revoke]
  related: [bestowal]
  forms: [bestowed, bestows, bestowing, bestowal]

- word: blandishment
  pos: noun
  ipa: /ˈblændɪʃmənt/
  phonetic: BLAN-dish-munt
  definition: A flattering or pleasing statement or action used to persuade someone gently to do something.
  synonyms: [flattery, cajolery, coaxing, wheedling, enticement]
  antonyms: [threat, coercion]
  related: [blandish]
  etymology: From "blandish," from Old French blandir, from Latin blandiri "to flatter," from blandus "smooth-talking."
  forms: [blandishments]

- word: blasphemy
  pos: noun
  ipa: /ˈblæsfəmi/
  phonetic: BLAS-fuh-mee
  definition: Speaking irreverently about God or sacred things; disrespect toward something regarded as sacrosanct.
  synonyms: [sacrilege, profanity, impiety, irreverence, desecration]
  antonyms: [reverence, piety]
  related: [blasphemous, blaspheme]
  etymology: From Greek blasphemia "slander, profane speech," via Latin and Old French.
  forms: [blasphemies, blasphemous, blaspheme, blasphemed, blaspheming]

- word: blatant
  pos: adjective
  ipa: /ˈbleɪtənt/
  phonetic: BLAY-tunt
  definition: Done openly and unashamedly; completely obvious, especially of something bad.
  synonyms: [flagrant, glaring, brazen, overt, conspicuous]
  antonyms: [subtle, covert, inconspicuous]
  related: [blatantly]
  etymology: Apparently coined by Edmund Spenser in The Faerie Queene (1596) for the "blatant beast," a monster of slander.
  forms: [blatantly]

- word: blight
  pos: noun / verb
  ipa: /blaɪt/
  phonetic: BLYTE
  definition: Something that spoils or damages; a plant disease; (verb) to spoil, harm, or destroy.
  synonyms: [scourge, plague, affliction, ruin, mar]
  antonyms: [boon, blessing]
  related: [blighted]
  forms: [blighted, blights, blighting]

- word: blithe
  pos: adjective
  ipa: /blaɪð/
  phonetic: BLYTHE
  definition: Showing casual, often improper indifference; carefree and cheerful.
  synonyms: [nonchalant, heedless, carefree, insouciant, lighthearted]
  antonyms: [concerned, careful, morose]
  related: [blithely, blitheness]
  etymology: From Old English blithe "joyous, kind, gentle."
  forms: [blithely]

- word: bluster
  pos: verb / noun
  ipa: /ˈblʌstər/
  phonetic: BLUS-ter
  definition: To talk loudly, aggressively, or boastfully with little effect; (noun) such loud, empty talk.
  synonyms: [rant, bluff, swagger, bombast, boast]
  antonyms: [humility, restraint]
  related: [blustery, blusterer]
  forms: [blustered, blusters, blustering]

- word: boisterous
  pos: adjective
  ipa: /ˈbɔɪstərəs/
  phonetic: BOY-ster-us
  definition: Noisy, energetic, and cheerful; rowdy.
  synonyms: [rowdy, raucous, unruly, exuberant, clamorous]
  antonyms: [quiet, restrained, subdued]
  related: [boisterously, boisterousness]
  forms: [boisterously, boisterousness]

- word: boon
  pos: noun
  ipa: /bun/
  phonetic: BOON
  definition: A thing that is helpful or beneficial; a blessing.
  synonyms: [blessing, benefit, godsend, windfall, advantage]
  antonyms: [bane, curse, blight]
  related: []
  etymology: From Old Norse bon "prayer, request"; the sense shifted from a favor asked to a favor granted.

- word: boorish
  pos: adjective
  ipa: /ˈbʊrɪʃ/
  phonetic: BOOR-ish
  definition: Rough and bad-mannered; coarse and insensitive.
  synonyms: [uncouth, churlish, crude, oafish, vulgar]
  antonyms: [refined, courteous, genteel]
  related: [boor, boorishly, boorishness]
  etymology: From "boor," from Dutch boer "farmer, peasant."
  forms: [boorishly, boorishness]

- word: braggart
  pos: noun
  ipa: /ˈbrægərt/
  phonetic: BRAG-ert
  definition: A person who boasts loudly about achievements or possessions.
  synonyms: [boaster, show-off, blowhard, swaggerer, egotist]
  antonyms: []
  related: [brag]
  forms: [braggarts]

- word: brandish
  pos: verb
  ipa: /ˈbrændɪʃ/
  phonetic: BRAN-dish
  definition: To wave or flourish something, especially a weapon, as a threat or in excitement.
  synonyms: [wave, flourish, wield, flaunt, display]
  antonyms: [conceal, hide]
  related: []
  etymology: From Old French brandir, from brand "sword blade."
  forms: [brandished, brandishes, brandishing]

- word: bravado
  pos: noun
  ipa: /brəˈvɑdoʊ/
  phonetic: bruh-VAH-doh
  definition: A bold manner or show of courage intended to impress or intimidate, often masking fear.
  synonyms: [bluster, swagger, bombast, boldness, machismo]
  antonyms: [timidity, modesty, diffidence]
  related: [bravura]
  etymology: From Spanish bravada, from bravo "bold."

- word: brazen
  pos: adjective
  ipa: /ˈbreɪzən/
  phonetic: BRAY-zun
  definition: Bold and without shame; literally, made of brass.
  synonyms: [shameless, audacious, impudent, flagrant, barefaced]
  antonyms: [timid, modest, sheepish]
  related: [brazenly, brazenness]
  etymology: From Old English bræsen "made of brass."
  forms: [brazenly, brazenness]

- word: brevity
  pos: noun
  ipa: /ˈbrɛvɪti/
  phonetic: BREV-ih-tee
  definition: Concise and exact use of words; shortness of duration.
  synonyms: [conciseness, terseness, succinctness, pithiness, briefness]
  antonyms: [verbosity, prolixity, wordiness]
  related: [brief]
  etymology: From Latin brevitas, from brevis "short."

- word: broach
  pos: verb
  ipa: /broʊtʃ/
  phonetic: BROHCH
  definition: To raise a sensitive or difficult subject for discussion; to pierce a container to draw out liquid.
  synonyms: [raise, introduce, bring up, mention, moot]
  antonyms: [avoid, drop]
  related: []
  etymology: From Old French brochier "to pierce," from broche "spike, pointed tool."
  forms: [broached, broaches, broaching]

- word: brusque
  pos: adjective
  ipa: /brʌsk/
  phonetic: BRUSK
  definition: Abrupt or offhand in speech or manner; curt.
  synonyms: [curt, abrupt, blunt, gruff, terse]
  antonyms: [courteous, gracious, polite]
  related: [brusquely, brusqueness]
  etymology: From French brusque "lively, fierce," from Italian brusco "sour, tart."
  forms: [brusquely, brusqueness]

- word: bucolic
  pos: adjective
  ipa: /bjuˈkɑlɪk/
  phonetic: byoo-KOL-ik
  definition: Relating to the pleasant aspects of the countryside or country life; pastoral.
  synonyms: [pastoral, rustic, rural, idyllic, arcadian]
  antonyms: [urban, metropolitan]
  related: []
  etymology: From Greek boukolikos "pastoral," from boukolos "cowherd," from bous "ox."

- word: buffoon
  pos: noun
  ipa: /bəˈfun/
  phonetic: buh-FOON
  definition: A ridiculous but amusing person; a clown or fool.
  synonyms: [clown, fool, jester, oaf, dolt]
  antonyms: [sage, genius]
  related: [buffoonery, buffoonish]
  etymology: From Italian buffone "jester," from buffa "joke."
  forms: [buffoons, buffoonery]

- word: bulwark
  pos: noun
  ipa: /ˈbʊlwərk/
  phonetic: BUL-wurk
  definition: A defensive wall; a person or thing that acts as a defense or safeguard.
  synonyms: [rampart, bastion, safeguard, buttress, fortification]
  antonyms: [vulnerability, weakness]
  related: []
  etymology: From Middle Dutch bolwerc, probably from bole "tree trunk, plank" + werc "work."
  forms: [bulwarks]

- word: burnish
  pos: verb
  ipa: /ˈbɜrnɪʃ/
  phonetic: BUR-nish
  definition: To polish by rubbing; to enhance or improve a reputation or image.
  synonyms: [polish, buff, shine, enhance, refine]
  antonyms: [tarnish, dull]
  related: [burnished]
  etymology: From Old French burnir "to make brown, polish," from brun "brown."
  forms: [burnished, burnishes, burnishing]

- word: buttress
  pos: verb / noun
  ipa: /ˈbʌtrəs/
  phonetic: BUT-rus
  definition: To support or strengthen; (noun) a structure built against a wall for support, or any source of support.
  synonyms: [bolster, reinforce, support, shore up, prop up]
  antonyms: [undermine, weaken]
  related: []
  forms: [buttressed, buttresses, buttressing]

- word: cabal
  pos: noun
  ipa: /kəˈbɑl/
  phonetic: kuh-BAHL
  definition: A secret political clique or faction plotting for its own ends.
  synonyms: [clique, faction, junta, coterie, conspiracy]
  antonyms: []
  related: []
  etymology: From French cabale, from medieval Latin cabala, ultimately from Hebrew qabbalah "tradition" (the source of "kabbalah").
  forms: [cabals]

- word: cadence
  pos: noun
  ipa: /ˈkeɪdəns/
  phonetic: KAY-dunss
  definition: A rhythmic rise and fall of the voice or sounds; a regular beat; in music, a closing sequence of chords.
  synonyms: [rhythm, lilt, meter, beat, intonation]
  antonyms: []
  related: [cadenced]
  etymology: From Latin cadere "to fall," via Italian cadenza and Old French.
  forms: [cadences]

- word: cajole
  pos: verb
  ipa: /kəˈdʒoʊl/
  phonetic: kuh-JOHL
  definition: To persuade someone by flattery or gentle, persistent coaxing.
  synonyms: [coax, wheedle, inveigle, sweet-talk, entice]
  antonyms: [coerce, force, bully]
  related: [cajolery]
  etymology: From French cajoler "to coax, flatter."
  forms: [cajoled, cajoles, cajoling, cajolery]

- word: calamity
  pos: noun
  ipa: /kəˈlæmɪti/
  phonetic: kuh-LAM-ih-tee
  definition: An event causing great and often sudden damage or distress; a disaster.
  synonyms: [disaster, catastrophe, cataclysm, tragedy, misfortune]
  antonyms: [blessing, boon, godsend]
  related: [calamitous]
  etymology: From Latin calamitas "damage, disaster."
  forms: [calamities, calamitous]

- word: callous
  pos: adjective
  ipa: /ˈkæləs/
  phonetic: KAL-us
  definition: Showing cruel disregard for others; emotionally hardened and insensitive.
  synonyms: [heartless, unfeeling, insensitive, cold-blooded, indifferent]
  antonyms: [compassionate, sympathetic, tender]
  related: [callously, callousness, callus]
  etymology: From Latin callosus "hard-skinned," from callum "hardened skin."
  forms: [callously, callousness]

- word: callow
  pos: adjective
  ipa: /ˈkæloʊ/
  phonetic: KAL-oh
  definition: Inexperienced and immature, especially of a young person.
  synonyms: [immature, inexperienced, green, naive, unsophisticated]
  antonyms: [mature, experienced, sophisticated]
  related: [callowness]
  etymology: From Old English calu "bald"; it once described unfledged young birds without feathers.
  forms: [callowness]

- word: calumny
  pos: noun
  ipa: /ˈkæləmni/
  phonetic: KAL-um-nee
  definition: The making of false and damaging statements about someone to harm their reputation; slander.
  synonyms: [slander, defamation, libel, vilification, aspersion]
  antonyms: [praise, vindication, eulogy]
  related: [calumniate, calumnious]
  etymology: From Latin calumnia "trickery, false accusation."
  forms: [calumnies, calumnious]

- word: candid
  pos: adjective
  ipa: /ˈkændɪd/
  phonetic: KAN-did
  definition: Truthful and straightforward; frank; of a photograph, taken informally.
  synonyms: [frank, forthright, outspoken, blunt, honest]
  antonyms: [guarded, evasive, disingenuous]
  related: [candidly, candor]
  etymology: From Latin candidus "white, pure, sincere," from candere "to shine."
  forms: [candidly]

- word: candor
  pos: noun
  ipa: /ˈkændər/
  phonetic: KAN-der
  definition: The quality of being open, honest, and sincere in expression; frankness.
  synonyms: [frankness, openness, forthrightness, honesty, directness]
  antonyms: [evasiveness, deceit, guile]
  related: [candid]
  etymology: From Latin candor "whiteness, purity, sincerity," from candere "to shine."
  forms: [candour]

- word: canny
  pos: adjective
  ipa: /ˈkæni/
  phonetic: KAN-ee
  definition: Having or showing shrewdness and good judgment, especially in money or business.
  synonyms: [shrewd, astute, sharp, savvy, prudent]
  antonyms: [foolish, naive, gullible]
  related: [cannily, canniness]
  etymology: A Scottish formation from "can" in the sense "know how."
  forms: [cannily, canniness, cannier, canniest]

- word: captious
  pos: adjective
  ipa: /ˈkæpʃəs/
  phonetic: KAP-shus
  definition: Tending to find fault or raise petty objections.
  synonyms: [carping, faultfinding, critical, nitpicking, caviling]
  antonyms: [approving, tolerant, uncritical]
  related: [captiously, captiousness]
  etymology: From Latin captiosus "sophistical, deceptive," from captio "a taking, deceiving."
  forms: [captiously, captiousness]

- word: capacious
  pos: adjective
  ipa: /kəˈpeɪʃəs/
  phonetic: kuh-PAY-shus
  definition: Having a lot of space inside; roomy.
  synonyms: [roomy, spacious, commodious, ample, voluminous]
  antonyms: [cramped, confined, narrow]
  related: [capaciousness, capacity]
  etymology: From Latin capax "able to hold much," from capere "to take, hold."
  forms: [capaciously, capaciousness]

- word: caricature
  pos: noun / verb
  ipa: /ˈkærɪkətʃər/
  phonetic: KAIR-ih-kuh-chur
  definition: A depiction exaggerating certain features for comic or grotesque effect; (verb) to portray in this way.
  synonyms: [parody, lampoon, burlesque, satire, travesty]
  antonyms: []
  related: [caricaturist]
  etymology: From Italian caricatura, from caricare "to load, exaggerate."
  forms: [caricatures, caricatured, caricaturing]

- word: carouse
  pos: verb
  ipa: /kəˈraʊz/
  phonetic: kuh-ROWZ
  definition: To drink plenty of alcohol and enjoy oneself with others in a noisy, lively way.
  synonyms: [revel, party, make merry, roister, binge]
  antonyms: []
  related: [carousal]
  etymology: From German gar aus "all out," as in drinking a cup to the bottom.
  forms: [caroused, carouses, carousing]

- word: categorical
  pos: adjective
  ipa: /ˌkætəˈɡɔrɪkəl/
  phonetic: kat-uh-GOR-ih-kul
  definition: Unambiguously explicit and direct; absolute and without qualification.
  synonyms: [unequivocal, absolute, unqualified, explicit, emphatic]
  antonyms: [qualified, equivocal, tentative]
  related: [categorically]
  forms: [categorically]

- word: cavalier
  pos: adjective
  ipa: /ˌkævəˈlɪr/
  phonetic: kav-uh-LEER
  definition: Showing a lack of proper concern; offhand, disdainful, or arrogantly dismissive.
  synonyms: [offhand, nonchalant, dismissive, casual, supercilious]
  antonyms: [careful, conscientious, serious]
  related: [cavalierly]
  etymology: From Italian cavaliere "horseman, knight," from Latin caballus "horse."
  forms: [cavalierly]

- word: cavil
  pos: verb / noun
  ipa: /ˈkævəl/
  phonetic: KAV-ul
  definition: To make petty or unnecessary objections; (noun) a trivial objection.
  synonyms: [quibble, carp, nitpick, complain, find fault]
  antonyms: [approve, praise]
  related: [caviler]
  etymology: From Latin cavillari "to jeer, quibble."
  forms: [caviled, cavilled, cavils, caviling, cavilling]

- word: cede
  pos: verb
  ipa: /sid/
  phonetic: SEED
  definition: To give up power, territory, or a right, typically unwillingly.
  synonyms: [surrender, yield, relinquish, concede, hand over]
  antonyms: [retain, seize, keep]
  related: [cession]
  etymology: From Latin cedere "to yield, go away."
  forms: [ceded, cedes, ceding]

- word: celerity
  pos: noun
  ipa: /səˈlɛrɪti/
  phonetic: suh-LER-ih-tee
  definition: Swiftness of movement or action.
  synonyms: [speed, swiftness, rapidity, alacrity, quickness]
  antonyms: [slowness, sluggishness, lethargy]
  related: [accelerate]
  etymology: From Latin celeritas, from celer "swift."

- word: censure
  pos: verb / noun
  ipa: /ˈsɛnʃər/
  phonetic: SEN-shur
  definition: To express severe, often formal disapproval of; (noun) such strong official criticism.
  synonyms: [condemn, reprimand, rebuke, castigate, denounce]
  antonyms: [praise, commend, endorse]
  related: [censorious]
  etymology: From Latin censura "judgment, assessment," from censere "to assess."
  forms: [censured, censures, censuring]

- word: cerebral
  pos: adjective
  ipa: /səˈribrəl/
  phonetic: suh-REE-brul
  definition: Intellectual rather than emotional or physical; relating to the brain.
  synonyms: [intellectual, analytical, scholarly, academic, highbrow]
  antonyms: [emotional, physical, visceral]
  related: [cerebrum, cerebrally]
  etymology: From Latin cerebrum "brain."
  forms: [cerebrally]

- word: chagrin
  pos: noun
  ipa: /ʃəˈɡrɪn/
  phonetic: shuh-GRIN
  definition: Distress or embarrassment at having failed or been humiliated.
  synonyms: [mortification, embarrassment, humiliation, vexation, annoyance]
  antonyms: [delight, pleasure, satisfaction]
  related: [chagrined]
  etymology: From French chagrin "sorrow, grief."
  forms: [chagrined]

- word: charlatan
  pos: noun
  ipa: /ˈʃɑrlətən/
  phonetic: SHAR-luh-tun
  definition: A person falsely claiming special knowledge or skill; a fraud.
  synonyms: [fraud, quack, impostor, mountebank, swindler]
  antonyms: [expert, professional]
  related: [charlatanism]
  etymology: From Italian ciarlatano, from ciarlare "to babble, chatter."
  forms: [charlatans, charlatanism]

- word: chary
  pos: adjective
  ipa: /ˈtʃɛri/
  phonetic: CHAIR-ee
  definition: Cautiously or suspiciously reluctant to do something; sparing in giving.
  synonyms: [wary, cautious, leery, circumspect, reluctant]
  antonyms: [heedless, rash, incautious]
  related: [charily]
  etymology: From Old English cearig "sorrowful, anxious," related to "care."
  forms: [charily]

- word: chastise
  pos: verb
  ipa: /tʃæˈstaɪz/
  phonetic: chas-TYZE
  definition: To rebuke or reprimand severely; formerly, to punish physically.
  synonyms: [reprimand, rebuke, castigate, berate, upbraid]
  antonyms: [praise, commend, laud]
  related: [chastisement]
  etymology: Related to "chasten," from Latin castigare "to correct, punish."
  forms: [chastised, chastises, chastising, chastisement]

- word: chide
  pos: verb
  ipa: /tʃaɪd/
  phonetic: CHYDE
  definition: To scold or rebuke mildly.
  synonyms: [scold, admonish, reprove, rebuke, reprimand]
  antonyms: [praise, compliment, commend]
  related: []
  etymology: From Old English cidan "to quarrel, complain."
  forms: [chided, chides, chiding]

- word: chimera
  pos: noun
  ipa: /kaɪˈmɪrə/
  phonetic: ky-MEER-uh
  definition: An unrealistic or impossible hope or fantasy; in myth, a fire-breathing monster combining lion, goat, and serpent.
  synonyms: [illusion, fantasy, delusion, pipe dream, mirage]
  antonyms: [reality, fact]
  related: [chimerical]
  etymology: From Greek khimaira "she-goat," the name of the mythical monster.
  forms: [chimeras, chimerical]

- word: choleric
  pos: adjective
