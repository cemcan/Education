# GRE vocabulary, part 3. Examples are added by build_words.py; never write them here.
words:
- word: convivial
  pos: adjective
  ipa: /kənˈvɪviəl/
  phonetic: kun-VIV-ee-ul
  definition: Friendly, lively, and enjoyable; fond of feasting, drinking, and good company.
  synonyms: [genial, sociable, jovial, festive, gregarious]
  antonyms: [unfriendly, austere, reserved]
  related: [conviviality]
  etymology: From Latin convivium "a feast," from con- "with" + vivere "to live."
  forms: [conviviality, convivially]

- word: copious
  pos: adjective
  ipa: /ˈkoʊpiəs/
  phonetic: KOH-pee-us
  definition: Abundant in supply or quantity.
  synonyms: [abundant, plentiful, profuse, ample, bountiful]
  antonyms: [scant, meager, sparse]
  related: [copiously, copiousness]
  etymology: From Latin copiosus, from copia "abundance" (compare "cornucopia").
  forms: [copiously]

- word: cordial
  pos: adjective
  ipa: /ˈkɔrdʒəl/
  phonetic: KOR-jul
  definition: Warm, friendly, and polite; heartfelt.
  synonyms: [warm, friendly, genial, amiable, gracious]
  antonyms: [hostile, cold, unfriendly]
  related: [cordiality, cordially]
  etymology: From Medieval Latin cordialis "of the heart," from Latin cor, cord- "heart."
  forms: [cordially, cordiality]

- word: corollary
  pos: noun
  ipa: /ˈkɔrəˌlɛri/
  phonetic: KOR-uh-lair-ee
  definition: A proposition or consequence that follows naturally from one already proven or established.
  synonyms: [consequence, result, upshot, inference, implication]
  antonyms: []
  related: []
  etymology: From Latin corollarium "money paid for a garland, gratuity," from corolla "small garland."
  forms: [corollaries]

- word: corporeal
  pos: adjective
  ipa: /kɔrˈpɔriəl/
  phonetic: kor-POR-ee-ul
  definition: Relating to the body; having a material, physical form rather than a spiritual one.
  synonyms: [bodily, physical, material, tangible, fleshly]
  antonyms: [spiritual, incorporeal, ethereal]
  related: [incorporeal, corporeality]
  etymology: From Latin corporeus "of the body," from corpus "body."
  forms: [corporeally, corporeality]

- word: corpulent
  pos: adjective
  ipa: /ˈkɔrpjələnt/
  phonetic: KOR-pyuh-lunt
  definition: Having a large, bulky body; fat.
  synonyms: [obese, stout, portly, rotund, fleshy]
  antonyms: [thin, slender, gaunt]
  related: [corpulence]
  etymology: From Latin corpulentus, from corpus "body."
  forms: [corpulence]

- word: corrosive
  pos: adjective
  ipa: /kəˈroʊsɪv/
  phonetic: kuh-ROH-siv
  definition: Tending to destroy or wear away gradually, whether by chemical action or by a harmful influence.
  synonyms: [caustic, destructive, erosive, acidic, harmful]
  antonyms: [harmless, benign, soothing]
  related: [corrode, corrosion]
  etymology: From Latin corrodere "to gnaw to pieces," from com- (intensive) + rodere "to gnaw."
  forms: [corrosively, corrosiveness]

- word: cosmopolitan
  pos: adjective / noun
  ipa: /ˌkɑzməˈpɑlɪtən/
  phonetic: koz-muh-POL-ih-tun
  definition: Familiar with and at ease in many countries and cultures; including people or elements from many parts of the world; a worldly person.
  synonyms: [worldly, sophisticated, cultured, urbane, multicultural]
  antonyms: [provincial, parochial, insular]
  related: [cosmopolitanism, cosmopolite]
  etymology: From Greek kosmopolitēs "citizen of the world," from kosmos "world" + politēs "citizen."
  forms: [cosmopolitanism]
  lowercase_only: true

- word: countenance
  pos: noun / verb
  ipa: /ˈkaʊntənəns/
  phonetic: KOWN-tuh-nunss
  definition: A person's face or facial expression; to tolerate, approve, or permit.
  synonyms: [visage, expression, mien, tolerate, sanction]
  antonyms: [disapprove, prohibit, condemn]
  related: [discountenance]
  etymology: From Old French contenance "bearing, behavior," from Latin continentia "restraint," from continere "to hold together."
  forms: [countenanced, countenances, countenancing]

- word: covert
  pos: adjective
  ipa: /ˈkoʊvərt/
  phonetic: KOH-vurt
  definition: Not openly acknowledged or displayed; secret.
  synonyms: [secret, clandestine, surreptitious, furtive, hidden]
  antonyms: [overt, open, public]
  related: [covertly]
  etymology: From Old French covert "covered," past participle of covrir "to cover."
  forms: [covertly]

- word: coy
  pos: adjective
  ipa: /kɔɪ/
  phonetic: KOY
  definition: Pretending to be shy or modest, often flirtatiously; reluctant to give details about something.
  synonyms: [demure, arch, bashful, evasive, reticent]
  antonyms: [forward, brazen, candid]
  related: [coyly, coyness]
  etymology: From Old French coi "quiet, still," from Latin quietus "at rest."
  forms: [coyly, coyness]

- word: craven
  pos: adjective
  ipa: /ˈkreɪvən/
  phonetic: KRAY-vun
  definition: Contemptibly lacking in courage; cowardly.
  synonyms: [cowardly, pusillanimous, spineless, timorous, fainthearted]
  antonyms: [brave, courageous, valiant]
  related: [cravenly, cravenness]
  forms: [cravenly]

- word: credence
  pos: noun
  ipa: /ˈkridəns/
  phonetic: KREE-dunss
  definition: Belief in or acceptance of something as true; the likelihood of something being true.
  synonyms: [belief, credibility, acceptance, faith, trust]
  antonyms: [disbelief, doubt, skepticism]
  related: [credible, credulous]
  etymology: From Medieval Latin credentia, from Latin credere "to believe."

- word: crestfallen
  pos: adjective
  ipa: /ˈkrɛstˌfɔlən/
  phonetic: KREST-faw-lun
  definition: Sad and disappointed, especially after a setback.
  synonyms: [dejected, downcast, despondent, disheartened, dispirited]
  antonyms: [elated, jubilant, cheerful]
  related: []
  etymology: From crest + fallen, picturing an animal whose crest has drooped.

- word: cumbersome
  pos: adjective
  ipa: /ˈkʌmbərsəm/
  phonetic: KUM-bur-sum
  definition: Large or heavy and therefore hard to carry or use; slow and complicated.
  synonyms: [unwieldy, awkward, bulky, clumsy, unmanageable]
  antonyms: [manageable, convenient, streamlined]
  related: [encumber, cumbersomeness]
  etymology: From Middle English cumber "to hinder" + -some.
  forms: [cumbersomeness]

- word: cupidity
  pos: noun
  ipa: /kjuˈpɪdɪti/
  phonetic: kyoo-PID-ih-tee
  definition: Greed for money or possessions.
  synonyms: [greed, avarice, avidity, covetousness, rapacity]
  antonyms: [generosity, liberality]
  related: []
  etymology: From Latin cupiditas "desire," from cupidus "desirous," from cupere "to desire" (compare Cupid).

- word: cursory
  pos: adjective
  ipa: /ˈkɜrsəri/
  phonetic: KUR-suh-ree
  definition: Hasty and therefore not thorough or detailed.
  synonyms: [perfunctory, superficial, hasty, desultory, quick]
  antonyms: [thorough, meticulous, careful]
  related: [cursorily]
  etymology: From Late Latin cursorius "of a runner," from Latin currere "to run."
  forms: [cursorily]

- word: curt
  pos: adjective
  ipa: /kɜrt/
  phonetic: KURT
  definition: Rudely brief in speech or manner.
  synonyms: [brusque, terse, abrupt, short, gruff]
  antonyms: [effusive, courteous, polite]
  related: [curtly, curtness]
  etymology: From Latin curtus "shortened, cut short."
  forms: [curtly, curtness]
  lowercase_only: true

- word: dauntless
  pos: adjective
  ipa: /ˈdɔntləs/
  phonetic: DAWNT-lus
  definition: Showing fearlessness and determination.
  synonyms: [fearless, intrepid, undaunted, valiant, bold]
  antonyms: [timid, fearful, cowardly]
  related: [daunt, undaunted]
  etymology: From daunt (Old French danter, from Latin domitare "to tame") + -less.
  forms: [dauntlessly]

- word: debase
  pos: verb
  ipa: /dɪˈbeɪs/
  phonetic: dih-BAYS
  definition: To reduce in quality, value, or character; to degrade.
  synonyms: [degrade, cheapen, devalue, corrupt, demean]
  antonyms: [elevate, enhance, ennoble]
  related: [debasement]
  etymology: From de- "down" + base "low," on the model of abase.
  forms: [debased, debases, debasing]

- word: debauchery
  pos: noun
  ipa: /dɪˈbɔtʃəri/
  phonetic: dih-BAW-chuh-ree
  definition: Excessive indulgence in sensual pleasures such as drinking and sex.
  synonyms: [dissipation, depravity, licentiousness, decadence, excess]
  antonyms: [temperance, abstinence, restraint]
  related: [debauch, debauched]
  etymology: From French débaucher "to lead astray from one's work."
  forms: [debaucheries]

- word: debilitate
  pos: verb
  ipa: /dɪˈbɪlɪteɪt/
  phonetic: dih-BIL-ih-tayt
  definition: To make very weak and infirm; to hinder or impair.
  synonyms: [weaken, enfeeble, sap, incapacitate, cripple]
  antonyms: [strengthen, invigorate, fortify]
  related: [debilitating, debility]
  etymology: From Latin debilitare, from debilis "weak."
  forms: [debilitated, debilitates, debilitating]

- word: decadence
  pos: noun
  ipa: /ˈdɛkədəns/
  phonetic: DEK-uh-dunss
  definition: Moral or cultural decline marked by excessive indulgence in pleasure or luxury.
  synonyms: [dissipation, degeneracy, self-indulgence, corruption, debauchery]
  antonyms: [virtue, morality, asceticism]
  related: [decadent]
  etymology: From Medieval Latin decadentia, from decadere "to fall away," from de- "down" + cadere "to fall."
  forms: [decadent]

- word: decorous
  pos: adjective
  ipa: /ˈdɛkərəs/
  phonetic: DEK-ur-us
  definition: In keeping with good taste and propriety; polite and restrained.
  synonyms: [proper, seemly, decent, dignified, genteel]
  antonyms: [indecorous, unseemly, improper]
  related: [decorum, decorously]
  etymology: From Latin decorus "seemly, fitting," from decor "beauty, grace."
  forms: [decorously]

- word: decorum
  pos: noun
  ipa: /dɪˈkɔrəm/
  phonetic: dih-KOR-um
  definition: Behavior in keeping with good taste and propriety.
  synonyms: [propriety, etiquette, decency, dignity, protocol]
  antonyms: [impropriety, indecorum, unseemliness]
  related: [decorous]
  etymology: From Latin decorum "that which is seemly," neuter of decorus.

- word: decry
  pos: verb
  ipa: /dɪˈkraɪ/
  phonetic: dih-KRY
  definition: To publicly denounce or criticize as bad or wrong.
  synonyms: [denounce, condemn, deplore, disparage, censure]
  antonyms: [praise, laud, extol]
  related: []
  etymology: From French décrier, from dé- "down" + crier "to cry."
  forms: [decried, decries, decrying]

- word: deduce
  pos: verb
  ipa: /dɪˈdus/
  phonetic: dih-DOOS
  definition: To arrive at a conclusion by reasoning from evidence or general principles.
  synonyms: [infer, conclude, reason, derive, glean]
  antonyms: []
  related: [deduction, deductive]
  etymology: From Latin deducere "to lead down," from de- "down" + ducere "to lead."
  forms: [deduced, deduces, deducing]

- word: defamation
  pos: noun
  ipa: /ˌdɛfəˈmeɪʃən/
  phonetic: def-uh-MAY-shun
  definition: The act of damaging someone's good reputation through false statements.
  synonyms: [slander, libel, calumny, vilification, aspersion]
  antonyms: [praise, commendation, vindication]
  related: [defame, defamatory]
  etymology: From Latin diffamare "to spread news of, disgrace," from dis- + fama "report, reputation."
  forms: [defamatory]

- word: defile
  pos: verb
  ipa: /dɪˈfaɪl/
  phonetic: dih-FILE
  definition: To make impure or unclean; to desecrate something sacred.
  synonyms: [pollute, contaminate, sully, desecrate, profane]
  antonyms: [purify, cleanse, sanctify]
  related: [defilement]
  etymology: From Old French defouler "to trample down," influenced by the obsolete English befile "to make foul."
  forms: [defiled, defiles, defiling]

- word: deft
  pos: adjective
  ipa: /dɛft/
  phonetic: DEFT
  definition: Quick and skillful; neatly clever.
  synonyms: [adroit, dexterous, nimble, skillful, adept]
  antonyms: [clumsy, awkward, inept]
  related: [deftly, deftness]
  etymology: A Middle English variant of daft, which originally meant "mild, meek."
  forms: [deftly, deftness]

- word: degenerate
  pos: verb / adjective
  ipa: /dɪˈdʒɛnəreɪt/
  phonetic: dih-JEN-uh-rayt
  definition: To decline or deteriorate physically, mentally, or morally; (adjective, dih-JEN-ur-it) having lost normal or desirable qualities.
  synonyms: [deteriorate, decline, worsen, decay, corrupt]
  antonyms: [improve, progress, flourish]
  related: [degeneration, degeneracy, degenerative]
  etymology: From Latin degenerare "to fall from one's ancestral quality," from de- "away from" + genus "race, kind."
  forms: [degenerated, degenerates, degenerating]

- word: deign
  pos: verb
  ipa: /deɪn/
  phonetic: DAYN
  definition: To do something one considers beneath one's dignity; to condescend.
  synonyms: [condescend, stoop, lower oneself, vouchsafe, consent]
  antonyms: [refuse, disdain]
  related: []
  etymology: From Old French deignier, from Latin dignari "to deem worthy," from dignus "worthy."
  forms: [deigned, deigns, deigning]

- word: delineate
  pos: verb
  ipa: /dɪˈlɪnieɪt/
  phonetic: dih-LIN-ee-ayt
  definition: To describe or portray precisely; to indicate the exact boundary of.
  synonyms: [describe, outline, depict, define, demarcate]
  antonyms: [obscure, confuse]
  related: [delineation]
  etymology: From Latin delineare "to sketch out," from de- + linea "line."
  forms: [delineated, delineates, delineating, delineation]

- word: delude
  pos: verb
  ipa: /dɪˈlud/
  phonetic: dih-LOOD
  definition: To impose a false belief on; to deceive.
  synonyms: [deceive, mislead, fool, dupe, hoodwink]
  antonyms: [enlighten, disabuse, undeceive]
  related: [delusion, delusional]
  etymology: From Latin deludere "to mock, deceive," from de- + ludere "to play."
  forms: [deluded, deludes, deluding]

- word: deluge
  pos: noun / verb
  ipa: /ˈdɛljudʒ/
  phonetic: DEL-yooj
  definition: A severe flood or heavy downpour; an overwhelming quantity of something; to inundate.
  synonyms: [flood, torrent, inundation, barrage, overwhelm]
  antonyms: [trickle, drought, dearth]
  related: []
  etymology: From Old French deluge, from Latin diluvium, from diluere "to wash away."
  forms: [deluged, deluges]

- word: demagogue
  pos: noun
  ipa: /ˈdɛməˌɡɑɡ/
  phonetic: DEM-uh-gog
  definition: A political leader who seeks support by appealing to popular prejudices and emotions rather than reason.
  synonyms: [rabble-rouser, agitator, firebrand, populist, instigator]
  antonyms: []
  related: [demagoguery, demagogic]
  etymology: From Greek dēmagōgos "leader of the people," from dēmos "people" + agōgos "leading."
  forms: [demagogues, demagogic, demagoguery]

- word: demean
  pos: verb
  ipa: /dɪˈmin/
  phonetic: dih-MEEN
  definition: To cause a severe loss in the dignity of or respect for someone or something.
  synonyms: [degrade, debase, humiliate, belittle, abase]
  antonyms: [dignify, elevate, honor]
  related: [demeaning]
  forms: [demeaned, demeans, demeaning]

- word: demeanor
  pos: noun
  ipa: /dɪˈminər/
  phonetic: dih-MEE-nur
  definition: Outward behavior or bearing.
  synonyms: [bearing, manner, mien, deportment, comportment]
  antonyms: []
  related: []
  etymology: From Middle English demenen "to conduct oneself," from Old French demener "to lead, guide."
  forms: [demeanour]

- word: demur
  pos: verb / noun
  ipa: /dɪˈmɜr/
  phonetic: dih-MUR
  definition: To raise doubts or objections, or show reluctance; (noun) an objection or hesitation.
  synonyms: [object, protest, balk, hesitate, take exception]
  antonyms: [accept, agree, consent]
  related: [demurral]
  etymology: From Old French demorer "to delay, linger," from Latin demorari, from de- + morari "to delay."
  forms: [demurred, demurs, demurring]

- word: demure
  pos: adjective
  ipa: /dɪˈmjʊr/
  phonetic: dih-MYOOR
  definition: Reserved, modest, and shy, often in an affected way.
  synonyms: [modest, reserved, coy, shy, decorous]
  antonyms: [brazen, bold, forward]
  related: [demurely, demureness]
  forms: [demurely]

- word: denounce
  pos: verb
  ipa: /dɪˈnaʊns/
  phonetic: dih-NOWNSS
  definition: To publicly declare to be wrong or evil; to inform against.
  synonyms: [condemn, censure, decry, castigate, vilify]
  antonyms: [praise, commend, endorse]
  related: [denunciation]
  etymology: From Old French denoncier, from Latin denuntiare "to announce, threaten," from de- + nuntiare "to announce."
  forms: [denounced, denounces, denouncing]

- word: deplore
  pos: verb
  ipa: /dɪˈplɔr/
  phonetic: dih-PLOR
  definition: To feel or express strong disapproval of; to regret deeply.
  synonyms: [condemn, lament, abhor, decry, deprecate]
  antonyms: [approve, applaud, welcome]
  related: [deplorable, deplorably]
  etymology: From Latin deplorare "to lament," from de- (intensive) + plorare "to weep, wail."
  forms: [deplored, deplores, deploring]

- word: depravity
  pos: noun
  ipa: /dɪˈprævɪti/
  phonetic: dih-PRAV-ih-tee
  definition: Moral corruption; wickedness.
  synonyms: [corruption, wickedness, vice, iniquity, degeneracy]
  antonyms: [virtue, morality, righteousness]
  related: [deprave, depraved]
  etymology: From Latin depravare "to distort, corrupt," from de- + pravus "crooked, wicked."
  forms: [depravities]

- word: deprecate
  pos: verb
  ipa: /ˈdɛprɪkeɪt/
  phonetic: DEP-rih-kayt
  definition: To express disapproval of; to play down or belittle.
  synonyms: [disparage, belittle, deplore, criticize, disapprove]
  antonyms: [praise, endorse, approve]
  related: [self-deprecating, deprecation, deprecatory]
  etymology: From Latin deprecari "to pray against, ward off," from de- "away" + precari "to pray."
  forms: [deprecates, deprecating, deprecatory]

- word: depreciate
  pos: verb
  ipa: /dɪˈpriʃieɪt/
  phonetic: dih-PREE-shee-ayt
  definition: To diminish in value over time; to disparage or belittle.
  synonyms: [devalue, decline, cheapen, belittle, disparage]
  antonyms: [appreciate, increase, rise]
  related: [depreciation]
  etymology: From Late Latin depretiare "to lower the price of," from de- + pretium "price."
  forms: [depreciated, depreciates, depreciating, depreciation]

- word: derelict
  pos: adjective / noun
  ipa: /ˈdɛrəlɪkt/
  phonetic: DAIR-uh-likt
  definition: In very poor condition from disuse and neglect; shamefully negligent of duty; (noun) a homeless or abandoned person.
  synonyms: [abandoned, dilapidated, neglected, negligent, remiss]
  antonyms: [conscientious, diligent, well-kept]
  related: [dereliction]
  etymology: From Latin derelictus, past participle of derelinquere "to abandon completely."
  forms: [derelicts]

- word: deride
  pos: verb
  ipa: /dɪˈraɪd/
  phonetic: dih-RIDE
  definition: To express contempt for; to ridicule.
  synonyms: [ridicule, mock, scoff at, scorn, disparage]
  antonyms: [praise, respect, admire]
  related: [derision, derisive]
  etymology: From Latin deridere "to laugh at," from de- "down" + ridere "to laugh."
  forms: [derided, derides, deriding]

- word: derision
  pos: noun
  ipa: /dɪˈrɪʒən/
  phonetic: dih-RIZH-un
  definition: Contemptuous ridicule or mockery.
  synonyms: [ridicule, mockery, scorn, contempt, disdain]
  antonyms: [respect, admiration, praise]
  related: [deride, derisive, derisory]
  etymology: From Latin derisio, from deridere "to laugh at."
  forms: [derisive, derisively]

- word: derivative
  pos: adjective / noun
  ipa: /dɪˈrɪvətɪv/
  phonetic: dih-RIV-uh-tiv
  definition: Imitative of another's work and lacking originality; (noun) something derived from another source.
  synonyms: [imitative, unoriginal, copied, secondhand, hackneyed]
  antonyms: [original, innovative, novel]
  related: [derive, derivation]
  etymology: From Latin derivativus, from derivare "to draw off (a stream)," from de- + rivus "stream."

- word: desecrate
  pos: verb
  ipa: /ˈdɛsɪkreɪt/
  phonetic: DES-ih-krayt
  definition: To treat a sacred place or thing with violent disrespect; to violate.
  synonyms: [defile, profane, violate, despoil, vandalize]
  antonyms: [consecrate, sanctify, revere]
  related: [desecration]
  etymology: Formed from de- "undo" + the Latin root of consecrate, sacrare "to make sacred."
  forms: [desecrated, desecrates, desecrating, desecration]

- word: desolate
  pos: adjective
  ipa: /ˈdɛsələt/
  phonetic: DES-uh-lut
  definition: Bleakly empty and without people; feeling utterly wretched and alone.
  synonyms: [barren, bleak, deserted, forlorn, disconsolate]
  antonyms: [populous, thriving, joyful]
  related: [desolation]
  etymology: From Latin desolatus, past participle of desolare "to abandon," from de- + solus "alone."
  forms: [desolation]

- word: despondent
  pos: adjective
  ipa: /dɪˈspɑndənt/
  phonetic: dih-SPON-dunt
  definition: In low spirits from loss of hope or courage.
  synonyms: [dejected, disheartened, downcast, hopeless, crestfallen]
  antonyms: [hopeful, cheerful, elated]
  related: [despondency, despondently]
  etymology: From Latin despondere "to give up, lose heart," from de- "away" + spondere "to promise."
  forms: [despondency, despondently]

- word: destitute
  pos: adjective
  ipa: /ˈdɛstɪtut/
  phonetic: DES-tih-toot
  definition: Extremely poor and lacking the means to provide for oneself; (with "of") completely lacking something.
  synonyms: [impoverished, penniless, indigent, needy, impecunious]
  antonyms: [wealthy, affluent, prosperous]
  related: [destitution]
  etymology: From Latin destitutus "forsaken," past participle of destituere "to abandon."
  forms: [destitution]

- word: detract
  pos: verb
  ipa: /dɪˈtrækt/
