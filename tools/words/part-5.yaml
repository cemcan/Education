# GRE vocabulary, part 5. Examples are added by build_words.py; never write them here.
words:
- word: ignoble
  pos: adjective
  ipa: /ɪɡˈnoʊbəl/
  phonetic: ig-NOH-bul
  definition: Dishonorable, base, or shameful in character or purpose; of humble or low birth.
  synonyms: [base, dishonorable, shameful, contemptible, mean]
  antonyms: [noble, honorable, worthy]
  related: [ignobly, ignobility]
  etymology: From Latin ignobilis "unknown, low-born," from in- "not" + gnobilis, an old form of nobilis "noble, well-known."
  forms: [ignobly]

- word: ignominious
  pos: adjective
  ipa: /ˌɪɡnəˈmɪniəs/
  phonetic: ig-nuh-MIN-ee-us
  definition: Deserving or causing public disgrace or shame; humiliating.
  synonyms: [disgraceful, humiliating, shameful, inglorious, degrading]
  antonyms: [honorable, glorious, creditable]
  related: [ignominy, ignominiously]
  etymology: From Latin ignominia "disgrace," from in- "not" + nomen "name, reputation."
  forms: [ignominiously]

- word: illusory
  pos: adjective
  ipa: /ɪˈlusəri/
  phonetic: ih-LOO-suh-ree
  definition: Based on illusion; not real, though seeming to be.
  synonyms: [illusive, deceptive, chimerical, unreal, fanciful]
  antonyms: [real, genuine, actual]
  related: [illusion, illusive]
  etymology: From Latin illusorius "mocking," from illudere "to mock," from in- "against" + ludere "to play."

- word: imbibe
  pos: verb
  ipa: /ɪmˈbaɪb/
  phonetic: im-BYBE
  definition: To drink, especially alcohol; to absorb or assimilate ideas or knowledge.
  synonyms: [drink, consume, absorb, assimilate, take in]
  antonyms: [abstain, reject]
  related: [imbiber]
  etymology: From Latin imbibere "to drink in," from in- "in" + bibere "to drink."
  forms: [imbibed, imbibes, imbibing]

- word: imbue
  pos: verb
  ipa: /ɪmˈbju/
  phonetic: im-BYOO
  definition: To inspire or permeate with a feeling, quality, or idea; to saturate with color or moisture.
  synonyms: [infuse, permeate, instill, suffuse, pervade]
  antonyms: [drain, empty]
  related: []
  etymology: From Latin imbuere "to wet, soak, stain."
  forms: [imbued, imbues, imbuing]

- word: immaculate
  pos: adjective
  ipa: /ɪˈmækjələt/
  phonetic: ih-MAK-yuh-lit
  definition: Perfectly clean, neat, or tidy; free from flaws or mistakes.
  synonyms: [spotless, pristine, flawless, impeccable, unblemished]
  antonyms: [dirty, flawed, sullied]
  related: [immaculately]
  etymology: From Latin immaculatus "unstained," from in- "not" + maculatus "spotted," from macula "spot."
  forms: [immaculately]

- word: immutable
  pos: adjective
  ipa: /ɪˈmjutəbəl/
  phonetic: ih-MYOO-tuh-bul
  definition: Unchanging over time or unable to be changed.
  synonyms: [unchangeable, fixed, invariable, permanent, constant]
  antonyms: [mutable, changeable, variable]
  related: [immutability, immutably]
  etymology: From Latin immutabilis, from in- "not" + mutabilis "changeable," from mutare "to change."
  forms: [immutably, immutability]

- word: impassive
  pos: adjective
  ipa: /ɪmˈpæsɪv/
  phonetic: im-PASS-iv
  definition: Not feeling or showing emotion.
  synonyms: [expressionless, stolid, unemotional, deadpan, stoical]
  antonyms: [expressive, emotional, demonstrative]
  related: [impassively, impassivity]
  forms: [impassively, impassivity]

- word: impeccable
  pos: adjective
  ipa: /ɪmˈpɛkəbəl/
  phonetic: im-PEK-uh-bul
  definition: In accordance with the highest standards; faultless.
  synonyms: [flawless, faultless, perfect, immaculate, exemplary]
  antonyms: [flawed, imperfect, faulty]
  related: [impeccably]
  etymology: From Latin impeccabilis "not liable to sin," from in- "not" + peccare "to sin."
  forms: [impeccably]

- word: impediment
  pos: noun
  ipa: /ɪmˈpɛdəmənt/
  phonetic: im-PED-uh-ment
  definition: A hindrance or obstruction in doing something; a defect in speech, such as a stammer.
  synonyms: [hindrance, obstacle, barrier, obstruction, encumbrance]
  antonyms: [aid, help, advantage]
  related: [impede]
  etymology: From Latin impedimentum, from impedire "to shackle the feet," from in- "in" + pes, ped- "foot."
  forms: [impediments]

- word: impending
  pos: adjective
  ipa: /ɪmˈpɛndɪŋ/
  phonetic: im-PEN-ding
  definition: About to happen; imminent, often of something unwelcome.
  synonyms: [imminent, looming, approaching, forthcoming, upcoming]
  antonyms: [remote, distant]
  related: [impend]
  etymology: From Latin impendere "to hang over," from in- "upon" + pendere "to hang."

- word: imperious
  pos: adjective
  ipa: /ɪmˈpɪriəs/
  phonetic: im-PEER-ee-us
  definition: Assuming power or authority without justification; arrogant and domineering.
  synonyms: [domineering, overbearing, haughty, peremptory, high-handed]
  antonyms: [humble, meek, submissive]
  related: [imperiously, imperiousness]
  etymology: From Latin imperiosus "commanding," from imperium "command, empire."
  forms: [imperiously, imperiousness]

- word: impertinent
  pos: adjective
  ipa: /ɪmˈpɜrtənənt/
  phonetic: im-PUR-tuh-nent
  definition: Not showing proper respect; rude; not pertinent or relevant.
  synonyms: [insolent, impudent, rude, impolite, cheeky]
  antonyms: [respectful, polite, courteous]
  related: [impertinence, impertinently]
  etymology: From Latin impertinens "not belonging," from in- "not" + pertinere "to relate to."
  forms: [impertinently, impertinence]

- word: imperturbable
  pos: adjective
  ipa: /ˌɪmpərˈtɜrbəbəl/
  phonetic: im-per-TUR-buh-bul
  definition: Unable to be upset or excited; calm and composed.
  synonyms: [composed, unflappable, serene, placid, unruffled]
  antonyms: [excitable, agitated, nervous]
  related: [imperturbability, imperturbably]
  etymology: From Latin imperturbabilis, from in- "not" + perturbare "to disturb greatly."
  forms: [imperturbably, imperturbability]

- word: impervious
  pos: adjective
  ipa: /ɪmˈpɜrviəs/
  phonetic: im-PUR-vee-us
  definition: Unable to be affected by something; not allowing fluid to pass through.
  synonyms: [impenetrable, immune, resistant, unaffected, impermeable]
  antonyms: [susceptible, vulnerable, permeable]
  related: [imperviousness]
  etymology: From Latin impervius "impassable," from in- "not" + per "through" + via "way."
  forms: [imperviousness]

- word: impetus
  pos: noun
  ipa: /ˈɪmpətəs/
  phonetic: IM-puh-tus
  definition: The force or energy with which something moves; a stimulus that makes something happen.
  synonyms: [momentum, stimulus, impulse, catalyst, incentive]
  antonyms: [deterrent, hindrance]
  related: [impetuous]
  etymology: From Latin impetus "assault, force," from impetere "to attack," from in- "toward" + petere "to seek."

- word: impious
  pos: adjective
  ipa: /ˈɪmpiəs/
  phonetic: IM-pee-us
  definition: Showing a lack of respect for God or religion; lacking proper respect.
  synonyms: [irreverent, ungodly, sacrilegious, profane, blasphemous]
  antonyms: [pious, devout, reverent]
  related: [impiety, impiously]
  etymology: From Latin impius, from in- "not" + pius "dutiful, pious."
  forms: [impiously]

- word: implicate
  pos: verb
  ipa: /ˈɪmpləˌkeɪt/
  phonetic: IM-pluh-kayt
  definition: To show someone to be involved in a crime or wrongdoing; to imply as a consequence.
  synonyms: [incriminate, involve, embroil, connect, inculpate]
  antonyms: [exonerate, absolve, clear]
  related: [implication]
  etymology: From Latin implicare "to entangle, involve," from in- "in" + plicare "to fold."
  forms: [implicated, implicates, implicating]

- word: implicit
  pos: adjective
  ipa: /ɪmˈplɪsɪt/
  phonetic: im-PLISS-it
  definition: Implied though not plainly expressed; absolute and unquestioning, as in implicit trust.
  synonyms: [implied, tacit, unspoken, understood, unstated]
  antonyms: [explicit, stated, expressed]
  related: [implicitly]
  etymology: From Latin implicitus "entangled," a variant past participle of implicare "to fold in."
  forms: [implicitly]

- word: implore
  pos: verb
  ipa: /ɪmˈplɔr/
  phonetic: im-PLOR
  definition: To beg someone earnestly or desperately to do something.
  synonyms: [beseech, entreat, beg, plead, supplicate]
  antonyms: [demand, command]
  related: [imploring, imploringly]
  etymology: From Latin implorare "to invoke with tears," from in- "toward" + plorare "to weep, cry out."
  forms: [implored, implores, imploring, imploringly]

- word: impregnable
  pos: adjective
  ipa: /ɪmˈprɛɡnəbəl/
  phonetic: im-PREG-nuh-bul
  definition: Unable to be captured or broken into; unable to be challenged or overcome.
  synonyms: [invulnerable, unassailable, impenetrable, invincible, unconquerable]
  antonyms: [vulnerable, assailable, defenseless]
  related: [impregnability]
  etymology: From Old French imprenable, from in- "not" + prenable "able to be taken," from prendre "to take."
  forms: [impregnability]

- word: impromptu
  pos: adjective / adverb
  ipa: /ɪmˈprɑmptu/
  phonetic: im-PROMP-too
  definition: Done without being planned or rehearsed; spontaneous.
  synonyms: [improvised, spontaneous, unrehearsed, extemporaneous, offhand]
  antonyms: [planned, rehearsed, prepared]
  related: []
  etymology: From Latin in promptu "in readiness," from promptus "readiness."

- word: improvident
  pos: adjective
  ipa: /ɪmˈprɑvədənt/
  phonetic: im-PROV-ih-dent
  definition: Not having or showing foresight; spendthrift or thoughtless about future needs.
  synonyms: [spendthrift, profligate, thriftless, wasteful, shortsighted]
  antonyms: [provident, thrifty, prudent]
  related: [improvidence, improvidently]
  etymology: From Latin in- "not" + providens "foreseeing," from providere "to see ahead."
  forms: [improvidently, improvidence]

- word: impudent
  pos: adjective
  ipa: /ˈɪmpjədənt/
  phonetic: IM-pyuh-dent
  definition: Not showing due respect for another person; impertinent and shameless.
  synonyms: [impertinent, insolent, brazen, cheeky, audacious]
  antonyms: [respectful, polite, deferential]
  related: [impudence, impudently]
  etymology: From Latin impudens "shameless," from in- "not" + pudens "ashamed," from pudere "to be ashamed."
  forms: [impudently, impudence]

- word: impunity
  pos: noun
  ipa: /ɪmˈpjunəti/
  phonetic: im-PYOO-nih-tee
  definition: Exemption from punishment or freedom from the harmful consequences of an action.
  synonyms: [immunity, exemption, license, freedom, dispensation]
  antonyms: [liability, accountability, culpability]
  related: []
  etymology: From Latin impunitas, from impunis "unpunished," from in- "not" + poena "penalty."

- word: inadvertent
  pos: adjective
  ipa: /ˌɪnədˈvɜrtənt/
  phonetic: in-ud-VUR-tent
  definition: Not resulting from or achieved through deliberate planning; unintentional.
  synonyms: [unintentional, accidental, unwitting, involuntary, careless]
  antonyms: [deliberate, intentional, purposeful]
  related: [inadvertently, inadvertence]
  etymology: From Latin in- "not" + advertere "to turn toward," hence "not paying attention."
  forms: [inadvertently, inadvertence]

- word: inane
  pos: adjective
  ipa: /ɪˈneɪn/
  phonetic: ih-NAYN
  definition: Silly; lacking sense or meaning.
  synonyms: [silly, fatuous, vacuous, senseless, asinine]
  antonyms: [sensible, meaningful, profound]
  related: [inanity, inanely]
  etymology: From Latin inanis "empty, vain."
  forms: [inanely, inanity, inanities]

- word: inarticulate
  pos: adjective
  ipa: /ˌɪnɑrˈtɪkjələt/
  phonetic: in-ar-TIK-yuh-lit
  definition: Unable to express one's ideas or feelings clearly or fluently; not expressed in words.
  synonyms: [tongue-tied, incoherent, unintelligible, mumbling, faltering]
  antonyms: [articulate, eloquent, fluent]
  related: [inarticulately, inarticulateness]
  forms: [inarticulately, inarticulateness]

- word: incandescent
  pos: adjective
  ipa: /ˌɪnkənˈdɛsənt/
  phonetic: in-kun-DESS-ent
  definition: Emitting light as a result of being heated; full of strong emotion, passionate or brilliant.
  synonyms: [glowing, luminous, radiant, brilliant, ardent]
  antonyms: [dull, dim, lackluster]
  related: [incandescence]
  etymology: From Latin incandescere "to begin to glow," from in- "in" + candescere, from candere "to be white, shine."
  forms: [incandescence]

- word: incense
  pos: verb
  ipa: /ɪnˈsɛns/
  phonetic: in-SENS
  definition: To make very angry; enrage.
  synonyms: [enrage, infuriate, anger, provoke, inflame]
  antonyms: [placate, pacify, soothe]
  related: []
  etymology: From Latin incendere "to set on fire," the same source as the noun "incense" for fragrant smoke.
  forms: [incensed, incenses, incensing]

- word: incessant
  pos: adjective
  ipa: /ɪnˈsɛsənt/
  phonetic: in-SESS-ent
  definition: Continuing without pause or interruption, often annoyingly so.
  synonyms: [ceaseless, unceasing, constant, relentless, perpetual]
  antonyms: [intermittent, sporadic, occasional]
  related: [incessantly]
  etymology: From Latin incessans, from in- "not" + cessare "to cease."
  forms: [incessantly]

- word: incipient
  pos: adjective
  ipa: /ɪnˈsɪpiənt/
  phonetic: in-SIP-ee-ent
  definition: In an initial stage; beginning to happen or develop.
  synonyms: [nascent, emerging, inchoate, budding, embryonic]
  antonyms: [mature, developed, advanced]
  related: [incipience]
  etymology: From Latin incipere "to begin," from in- "into" + capere "to take."

- word: incisive
  pos: adjective
  ipa: /ɪnˈsaɪsɪv/
  phonetic: in-SY-siv
  definition: Intelligently analytical and clear-thinking; sharp and direct.
  synonyms: [penetrating, perceptive, acute, astute, trenchant]
  antonyms: [vague, dull, muddled]
  related: [incisively, incisiveness]
  etymology: From Medieval Latin incisivus, from Latin incidere "to cut into."
  forms: [incisively, incisiveness]

- word: incite
  pos: verb
  ipa: /ɪnˈsaɪt/
  phonetic: in-SYTE
  definition: To encourage or stir up violent or unlawful behavior; to urge or provoke someone to act.
  synonyms: [provoke, instigate, foment, stir up, goad]
  antonyms: [deter, discourage, quell]
  related: [incitement]
  etymology: From Latin incitare "to set in rapid motion," from in- "on" + citare "to rouse."
  forms: [incited, incites, inciting, incitement]

- word: inclement
  pos: adjective
  ipa: /ɪnˈklɛmənt/
  phonetic: in-KLEM-ent
  definition: Of weather, unpleasantly cold or wet; harsh or unmerciful.
  synonyms: [stormy, harsh, severe, foul, rough]
  antonyms: [fine, mild, clement]
  related: [inclemency]
  etymology: From Latin inclemens, from in- "not" + clemens "mild, merciful."
  forms: [inclemency]

- word: incoherent
  pos: adjective
  ipa: /ˌɪnkoʊˈhɪrənt/
  phonetic: in-koh-HEER-ent
  definition: Expressed in a confused or unclear way; lacking logical connection or consistency.
  synonyms: [unintelligible, confused, disjointed, rambling, muddled]
  antonyms: [coherent, lucid, articulate]
  related: [incoherence, incoherently]
  forms: [incoherently, incoherence]

- word: incorrigible
  pos: adjective
  ipa: /ɪnˈkɔrɪdʒəbəl/
  phonetic: in-KOR-ij-uh-bul
  definition: Not able to be corrected, improved, or reformed.
  synonyms: [incurable, inveterate, hopeless, irredeemable, hardened]
  antonyms: [reformable, correctable, manageable]
  related: [incorrigibly]
  etymology: From Latin incorrigibilis, from in- "not" + corrigere "to correct."
  forms: [incorrigibly]

- word: incredulous
  pos: adjective
  ipa: /ɪnˈkrɛdʒələs/
  phonetic: in-KREJ-uh-lus
  definition: Unwilling or unable to believe something; showing disbelief.
  synonyms: [disbelieving, skeptical, doubtful, dubious, unconvinced]
  antonyms: [credulous, believing, trusting]
  related: [incredulity, incredulously]
  etymology: From Latin incredulus, from in- "not" + credulus "believing," from credere "to believe."
  forms: [incredulously, incredulity]

- word: inculcate
  pos: verb
  ipa: /ɪnˈkʌlˌkeɪt/
  phonetic: in-KUL-kayt
  definition: To instill an idea, attitude, or habit by persistent instruction or repetition.
  synonyms: [instill, implant, ingrain, impress, indoctrinate]
  antonyms: []
  related: [inculcation]
  etymology: From Latin inculcare "to tread in, press in," from in- "into" + calcare "to tread," from calx "heel."
  forms: [inculcated, inculcates, inculcating, inculcation]

- word: indefatigable
  pos: adjective
  ipa: /ˌɪndɪˈfætɪɡəbəl/
  phonetic: in-dih-FAT-ig-uh-bul
  definition: Persisting tirelessly; incapable of being fatigued.
  synonyms: [tireless, untiring, unflagging, relentless, persevering]
  antonyms: [lazy, flagging, weary]
  related: [indefatigably]
  etymology: From Latin indefatigabilis, from in- "not" + defatigare "to wear out."
  forms: [indefatigably]

- word: indelible
  pos: adjective
  ipa: /ɪnˈdɛləbəl/
  phonetic: in-DEL-uh-bul
  definition: Not able to be forgotten or removed; making marks that cannot be erased.
  synonyms: [permanent, ineradicable, lasting, enduring, ingrained]
  antonyms: [erasable, temporary, fleeting]
  related: [indelibly]
  etymology: From Latin indelebilis, from in- "not" + delebilis "able to be destroyed," from delere "to destroy, blot out."
  forms: [indelibly]

- word: indigent
  pos: adjective / noun
  ipa: /ˈɪndɪdʒənt/
  phonetic: IN-dih-jent
  definition: Poor; needy; a needy person.
  synonyms: [impoverished, destitute, penniless, needy, impecunious]
  antonyms: [wealthy, affluent, rich]
  related: [indigence]
  etymology: From Latin indigens, present participle of indigere "to lack, need."
  forms: [indigence]

- word: indignant
  pos: adjective
  ipa: /ɪnˈdɪɡnənt/
  phonetic: in-DIG-nent
  definition: Feeling or showing anger at what is perceived as unfair treatment.
  synonyms: [aggrieved, resentful, offended, outraged, affronted]
  antonyms: [pleased, content, satisfied]
  related: [indignation, indignantly]
  etymology: From Latin indignari "to regard as unworthy," from in- "not" + dignus "worthy."
  forms: [indignantly, indignation]

- word: indiscriminate
  pos: adjective
  ipa: /ˌɪndɪˈskrɪmənət/
  phonetic: in-dih-SKRIM-ih-nit
  definition: Done at random or without careful judgment; not distinguishing between things.
  synonyms: [random, wholesale, undiscriminating, unselective, haphazard]
  antonyms: [selective, discriminating, careful]
  related: [indiscriminately]
  forms: [indiscriminately]

- word: indomitable
  pos: adjective
  ipa: /ɪnˈdɑmɪtəbəl/
  phonetic: in-DOM-ih-tuh-bul
  definition: Impossible to subdue or defeat.
  synonyms: [invincible, unconquerable, unyielding, resolute, steadfast]
  antonyms: [yielding, submissive, weak]
  related: [indomitably]
  etymology: From Late Latin indomitabilis, from in- "not" + domitare "to tame."
  forms: [indomitably]

- word: indubitable
  pos: adjective
  ipa: /ɪnˈdubɪtəbəl/
  phonetic: in-DOO-bih-tuh-bul
  definition: Impossible to doubt; unquestionable.
  synonyms: [unquestionable, undeniable, indisputable, incontrovertible, certain]
  antonyms: [doubtful, questionable, dubious]
  related: [indubitably]
  etymology: From Latin indubitabilis, from in- "not" + dubitare "to doubt."
  forms: [indubitably]

- word: ineffectual
  pos: adjective
  ipa: /ˌɪnɪˈfɛktʃuəl/
  phonetic: in-ih-FEK-choo-ul
  definition: Not producing any or the desired effect; lacking the ability to fulfill a role.
  synonyms: [ineffective, futile, unavailing, feeble, inadequate]
  antonyms: [effective, efficacious, competent]
  related: [ineffectually]
  forms: [ineffectually]

- word: inept
  pos: adjective
  ipa: /ɪˈnɛpt/
  phonetic: ih-NEPT
  definition: Having or showing no skill; clumsy; not suitable to the occasion.
  synonyms: [incompetent, clumsy, bungling, maladroit, inexpert]
  antonyms: [adept, skillful, competent]
  related: [ineptitude, ineptly]
  etymology: From Latin ineptus "unsuited, foolish," from in- "not" + aptus "fitted."
  forms: [ineptly, ineptitude]

- word: inert
  pos: adjective
  ipa: /ɪˈnɜrt/
  phonetic: ih-NURT
  definition: Lacking the ability or strength to move; sluggish; chemically inactive.
  synonyms: [inactive, motionless, sluggish, torpid, lifeless]
  antonyms: [active, lively, reactive]
  related: [inertia, inertness]
  etymology: From Latin iners "unskilled, idle," from in- "without" + ars "skill."
  forms: [inertness]

- word: infallible
  pos: adjective
  ipa: /ɪnˈfæləbəl/
  phonetic: in-FAL-uh-bul
  definition: Incapable of making mistakes or being wrong; never failing.
  synonyms: [unerring, faultless, flawless, foolproof, reliable]
  antonyms: [fallible, flawed, unreliable]
  related: [infallibility, infallibly]
  etymology: From Medieval Latin infallibilis, from in- "not" + fallere "to deceive."
  forms: [infallibly, infallibility]

- word: infamy
  pos: noun
  ipa: /ˈɪnfəmi/
  phonetic: IN-fuh-mee
  definition: The state of being well known for some bad quality or deed; an evil or wicked act.
  synonyms: [notoriety, disrepute, disgrace, ignominy, dishonor]
  antonyms: [honor, esteem, renown]
  related: [infamous]
  etymology: From Latin infamia, from in- "not" + fama "reputation."

- word: infinitesimal
  pos: adjective
  ipa: /ˌɪnfɪnɪˈtɛsəməl/
  phonetic: in-fin-ih-TESS-ih-mul
  definition: Extremely small.
  synonyms: [minuscule, minute, tiny, negligible, microscopic]
  antonyms: [enormous, vast, immense]
