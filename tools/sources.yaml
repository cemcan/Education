# Public-domain books mirrored by the GITenberg project on GitHub.
# `repo` is github.com/GITenberg/<repo>; the trailing number is the Project Gutenberg ebook id.
# `year` is first publication; `start` skips editors' introductions and translators' prefaces
# so every quote is the author's own text. Translated works name their translator so quotes are attributed correctly.
