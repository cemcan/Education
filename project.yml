# XcodeGen spec. On a Mac:  brew install xcodegen && xcodegen generate
name: GREVocab
options:
  bundleIdPrefix: com.cemcan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here (or pick it in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""

targets:
  GREVocab:
    type: application
    platform: iOS
    sources:
      - path: GREVocab/App
      - path: GREVocab/Shared
    info:
      path: GREVocab/App/Info.plist
      properties:
        CFBundleDisplayName: GRE Vocab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: GRE Vocab saves vocabulary wallpapers to your photo library so you can set them as your Lock Screen.
        CFBundleURLTypes:
          - CFBundleURLName: com.cemcan.grevocab
            CFBundleURLSchemes:
              - grevocab
    entitlements:
      path: GREVocab/App/GREVocab.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cemcan.grevocab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cemcan.grevocab
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: GREVocabWidget
        embed: true

  GREVocabWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GREVocab/Widget
      - path: GREVocab/Shared
    info:
      path: GREVocab/Widget/Info.plist
      properties:
        CFBundleDisplayName: GRE Vocab
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GREVocab/Widget/GREVocabWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cemcan.grevocab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cemcan.grevocab.widget
        TARGETED_DEVICE_FAMILY: "1"

# One shared scheme that runs the app (with the widget embedded), so Xcode
# never defaults to launching the widget extension on its own.
schemes:
  GREVocab:
    build:
      targets:
        GREVocab: all
        GREVocabWidget: all
    run:
      config: Debug
      executable: GREVocab
    archive:
      config: Release
